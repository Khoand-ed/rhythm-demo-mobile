# One environment - staging or production - as a compose project of its own:
#
#   docker compose -f deploy/compose/app.compose.yml --env-file /srv/promuse/staging/.env up -d
#
# The project is promuse-<environment>, so the two never share a container, a volume or a
# database. deploy.sh writes the .env and runs this; nothing else should.
#
# Variables, in /srv/promuse/<environment>/.env (see app.env.example):
#   PROMUSE_ENV         staging or production - the project name, and the label on every metric
#   API_IMAGE           the image to run, by its tag: ghcr.io/<owner>/promuse-api:sha-<commit>
#   DB_PASSWORD         this environment's Postgres password (hex: it is spliced into a connection string)
#   JWT_SIGNING_KEY     this environment's token signing key, 32+ characters
#   MONITOR_DB_PASSWORD the read-only role Alloy reads Postgres with (the edge's value)
#
# The edge (edge.compose.yml) must be up first: it creates the promuse-edge network this joins.

name: promuse-${PROMUSE_ENV:?}

services:
  postgres:
    # Same minor line as development (server/docker-compose.yml), CI and the tests.
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: promuse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: promuse
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U promuse -d promuse"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 用带环境的名字 / Reached by postgres-<environment>, never by its service name. Compose gives
    # every container its service name on every network it joins, and both environments' databases
    # sit on the shared edge network: there, `postgres` names staging's AND production's, and an API
    # asking for it gets either. postgres-<environment> is one database on both networks. Alloy reads
    # its statistics by it too, as the read-only promuse_monitor role. No port is published.
    networks:
      default:
        aliases:
          - postgres-${PROMUSE_ENV}
      edge:
        aliases:
          - postgres-${PROMUSE_ENV}
    deploy:
      resources:
        limits:
          memory: 384M

  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # postgres-<environment>, not postgres: see the database's networks above.
      ConnectionStrings__Promuse: Host=postgres-${PROMUSE_ENV};Port=5432;Database=promuse;Username=promuse;Password=${DB_PASSWORD:?}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?}
      # Caddy is the only way in and replaces any X-Forwarded-For a client sends, so the sign-in
      # limit can trust it to name the caller (ForwardedHeadersTests).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # The scopes carry the request's trace id into every JSON log line.
      Logging__Console__FormatterOptions__IncludeScopes: "true"
      # 不记每条 SQL / EF Core logs every SQL statement it runs at Information: every query the API
      # makes, into Loki, and a few hundred lines of a migration's SQL into each deploy's log. A
      # statement that fails is logged at Error, so nothing a problem needs is lost.
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${PROMUSE_ENV}
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
    volumes:
      # 公告图片 / Uploaded notice pictures. Mounted where the image already keeps them, owned by
      # its own user: a fresh volume takes the ownership of the folder it covers, and a folder the
      # image does not have would come up owned by root and refuse every upload.
      - banners:/app/App_Data/banners
    networks:
      default:
      edge:
        # Caddy reaches this environment's API by this name - `api` alone, on the edge network,
        # would name both environments' (see the database's networks).
        aliases:
          - api-${PROMUSE_ENV}
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  edge:
    name: promuse-edge
    external: true

volumes:
  db:
  banners:
