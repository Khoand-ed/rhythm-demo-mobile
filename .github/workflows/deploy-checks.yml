name: deploy-checks

# Checks what the VM runs - the scripts, the compose files and the configuration of every service in
# them - with each tool's own validator, so a broken file fails here, in the pull request, rather
# than on the VM when Caddy or Loki will not start. No secrets: the rehearsal's throwaway values
# (deploy/local/*.env) stand in for the real ones.
#
# The image itself is backend-checks' job (its `container` job builds and starts it).

on:
  push:
    branches: [main]
    paths: &deploy-paths
      - 'deploy/**'
      # Every workflow, not only the deploy ones: deploy.yml calls backend-checks.yml, so a mistake
      # in that one stops a deploy as surely as one in deploy.yml.
      - '.github/workflows/**'

  pull_request:
    paths: *deploy-paths

  workflow_dispatch:

concurrency:
  group: deploy-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configs:
    name: Scripts and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      # shellcheck ships with GitHub's Ubuntu runners. -x follows the `source lib.sh` lines.
      - name: Shell scripts
        run: shellcheck -x -P deploy/scripts -S warning deploy/scripts/*.sh deploy/local/*.sh deploy/docker/*.sh

      - name: Compose files
        run: |
          docker compose -f deploy/compose/edge.compose.yml --env-file deploy/local/edge.env config --quiet
          set -a; . deploy/local/staging.env; set +a
          PROMUSE_ENV=staging API_IMAGE=promuse-api:ci MONITOR_DB_PASSWORD=ci \
            docker compose -f deploy/compose/app.compose.yml config --quiet

      # The image tags are the ones the compose files pin, so a check passes only for the version
      # that will run it.
      - name: Caddyfile
        run: >-
          docker run --rm -v "$PWD/deploy/caddy:/c:ro"
          -e STAGING_HOST=staging.example.org -e PRODUCTION_HOST=example.org
          -e GRAFANA_HOST=grafana.example.org -e ACME_EMAIL=ci@example.org
          caddy:2.11.7 caddy validate --config /c/Caddyfile --adapter caddyfile

      # Unformatted, the file still works, but every reload on the VM (edge.sh) logs a warning
      # about it into the deploy's log.
      - name: Caddyfile is formatted
        run: docker run --rm -v "$PWD/deploy/caddy:/c:ro" caddy:2.11.7 caddy fmt --diff /c/Caddyfile

      - name: Alloy
        run: docker run --rm -v "$PWD/deploy/monitoring/alloy:/c:ro" grafana/alloy:v1.21.0 fmt /c/config.alloy > /dev/null

      - name: Prometheus
        run: >-
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring/prometheus:/c:ro"
          prom/prometheus:v3.15.0 check config /c/prometheus.yml

      - name: Loki
        run: >-
          docker run --rm -v "$PWD/deploy/monitoring/loki:/c:ro"
          grafana/loki:3.7.9 -config.file=/c/loki.yaml -verify-config

      - name: Grafana dashboards
        run: for f in deploy/monitoring/grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done

      # actionlint reads a workflow the way GitHub will - its syntax, its expressions and the
      # contexts they read, a reusable workflow's inputs and outputs against its callers - and runs
      # shellcheck over every run: block. A mistake there otherwise shows only once it is on main,
      # as a deploy that does not start.
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -no-color
