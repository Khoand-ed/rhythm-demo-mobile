name: project-checks

# Repository integrity checks that need no Unity licence and no secrets, so they
# run on every pull request including ones from forks. The Unity editor job is a
# separate workflow and a separate decision: see docs in the repo root.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Unity repo integrity
    # ubuntu-24.04, not ubuntu-latest. Between 2026-10-19 and 2026-11-19 GitHub moves
    # ubuntu-latest to 26.04, and everything preinstalled on the image moves with it -
    # shellcheck 0.9 to 0.11, Python 3.12 to 3.14, the kernel 6 to 7. That is a change
    # of its own, to make on purpose in one pull request, rather than one that arrives
    # unannounced in the middle of an unrelated one.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # lfs: false is deliberate. None of these checks read binary content, and
      # the repository holds ~31 MB of LFS objects against a 1 GiB/month free
      # bandwidth quota shared with every human clone. Fetching them on every
      # push would exhaust that quota in about a month and break `git lfs pull`
      # for the whole team until it resets.
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # A missing or duplicated .meta breaks asset references silently, and the
      # symptom appears days later as "Missing (Mono Script)".
      - name: Unity .meta integrity
        run: python ci/check_meta.py

      # Same script the pre-commit hook runs, with the structural rules added.
      - name: Beatmap chart validity
        run: python ci/check_beatmaps.py --all --strict

      # A story that does not parse is skipped on the phone; catch it here instead.
      - name: Story scripts
        run: python ci/check_stories.py --strict

      # The admin page names items from server/data/items.json; an ItemMeta added or renamed
      # without re-exporting it would show there as "unknown".
      - name: Item catalog
        run: python ci/check_items.py

      - name: Repo hygiene
        run: python ci/check_repo_hygiene.py
