          schema:
            type: string
            pattern: '^[a-z0-9_]{1,64}$'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpsertRequest'
      responses:
        '200':
          description: Saved as a new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /v1/stories/patches:
    get:
      tags: [stories]
      operationId: getStoryPatches
      summary: Every story correction in force.
      description: |
        The revision is the ETag; a client holding it gets 304. Asked before a story plays,
        waiting only a moment - a story never waits on the network.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The corrections.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryPatchList'
        '304':
          description: Unchanged since the revision in If-None-Match.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/admin/stories/patches:
    get:
      tags: [admin]
      operationId: listStoryPatches
      summary: The corrections in force, newest first, with who made them.
      responses:
        '200':
          description: The corrections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStoryPatchList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/stories/patches/{storyId}/{lineId}:
    parameters:
      - name: storyId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9_]{1,64}$'
      - name: lineId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9]{4,8}$'
    put:
      tags: [admin]
      operationId: saveStoryPatch
      summary: Correct one line, or replace its correction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryPatchRequest'
      responses:
        '200':
          description: Saved; live on the next story played.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStoryPatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [admin]
      operationId: revertStoryPatch
      summary: Take a correction back; the line reads as the game has it again.
      responses:
        '204':
          description: Taken back.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`STORY_PATCH_NOT_FOUND` - no correction held for that line.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/campaign:
    get:
      tags: [campaign]
      operationId: getCampaign
      summary: The chapters and stages, with which this player has open and cleared.
      responses:
        '200':
          description: The campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/admin/campaign:
    get:
      tags: [admin]
      operationId: getAdminCampaign
      summary: The whole campaign document and its version (also the ETag).
      responses:
        '200':
          description: The campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCampaign'
    put:
      tags: [admin]
      operationId: saveCampaign
      summary: Save a new version of the whole campaign (If-Match).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignUpsertRequest'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCampaign'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /v1/mail:
    get:
      tags: [mail]
      operationId: getMailbox
      summary: The player's box, newest first, at most 100.
      responses:
        '200':
          description: The box.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailBox'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/mail/{mailId}/open:
    parameters:
      - name: mailId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [mail]
      operationId: openMail
      summary: Open a mail - read it and collect its attachments.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailActionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`MAIL_NOT_FOUND` - not in this box (expired, deleted, retracted, or never sent here).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/mail/collect-all:
    post:
      tags: [mail]
      operationId: collectAllMail
      summary: Open every new mail and collect everything, totalled per item.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailActionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/mail/delete-opened:
    post:
      tags: [mail]
      operationId: deleteOpenedMail
      summary: Delete Read - every opened mail leaves the box.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailActionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/admin/mail:
    get:
      tags: [admin]
      operationId: listSentMail
      summary: The last hundred mails sent, with how many players opened each.
      responses:
        '200':
          description: The mails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMailList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags: [admin]
      operationId: sendMail
      summary: Send a mail to one player, or to every player who exists now.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailSendRequest'
      responses:
        '201':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/admin/mail/{mailId}/retract:
    post:
      tags: [admin]
      operationId: retractMail
      summary: Take a mail out of every box. What was collected stays collected.
      parameters:
        - name: mailId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Retracted.
        '404':
          description: '`MAIL_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/signatures:
    get:
      tags: [admin]
      operationId: listSignatures
      summary: The profile lines written most recently, or the players a name finds.
      description: |
        With no `query`, the players who have a line, the most recently written first.
        With one, `Name#0420` is that one player and anything else matches names
        containing it, ignoring case - whether or not they have a line, so a locked
        player can be found to unlock.
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The players.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSignatureList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/admin/signatures/history:
    get:
      tags: [admin]
      operationId: getSignatureModerationHistory
      summary: Everything moderators have done to profile lines, newest first.
      parameters:
        - name: playerId
          in: query
          description: One player's history; everyone's when absent.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureModerationHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/signatures/{playerId}/remove:
    post:
      tags: [admin]
      operationId: removeSignature
      summary: Take a player's line down, lock it for a while if asked, and tell them by mail if asked.
      description: |
        One transaction: the line goes, the lock is set, the mail is sent and the history
        is written together - and every open report on the line closes as Removed, each
        reporter thanked by mail. A new lock never shortens one already running. A lock alone,
        on a player with no line, is allowed; neither a line to remove nor a lock is
        refused with 422. The player's state version moves, as it does for any write to
        the save.
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRemoveRequest'
      responses:
        '200':
          description: The player as the list now shows them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSignature'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`PLAYER_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/admin/signatures/{playerId}/unlock:
    post:
      tags: [admin]
      operationId: unlockSignature
      summary: Lift a lock before its time. A player who is not locked is refused with 422.
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureUnlockRequest'
      responses:
        '200':
          description: The player as the list now shows them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSignature'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`PLAYER_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/admin/signatures/reports:
    get:
      tags: [admin]
      operationId: getSignatureReports
      summary: The players whose lines have open reports, the most reported first.
      responses:
        '200':
          description: The queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReportQueue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/signatures/{playerId}/dismiss-reports:
    post:
      tags: [admin]
      operationId: dismissSignatureReports
      summary: The line is within the rules - close its open reports and thank each reporter by mail.
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureReportDismissRequest'
      responses:
        '204':
          description: Dismissed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/admin/runs/flagged:
    get:
      tags: [admin]
      operationId: listFlaggedRuns
      summary: Clears the review flagged, waiting for a decision - or, with decided=true, the decisions made.
      description: |
        Waiting runs oldest first; decided ones newest first. Each carries the claim beside
        what the server's replay of its trace counted, the flags, and the timing measured.
      parameters:
        - name: decided
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFlaggedRunList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/admin/runs/{runId}/approve:
    post:
      tags: [admin]
      operationId: approveFlaggedRun
      summary: Rank a flagged clear, at the score the server's replay came to.
      description: |
        On the all-time board and the board of the week it was played in, each only if it
        beats the player's line there. With no replay (an operator the ruleset did not
        hold) at the claimed score. A replay that lost the run has nothing to rank.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunDecisionRequest'
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFlaggedRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`RUN_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            `RUN_NOT_IN_REVIEW` - not flagged, not a clear, or already decided;
            `RUN_NOT_RANKABLE` - the replay loses the run.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/admin/runs/{runId}/reject:
    post:
      tags: [admin]
      operationId: rejectFlaggedRun
      summary: Keep a flagged clear off the boards for good, and mail the player why.
      description: The note is required - it is the reason the player is mailed. The clear and its rewards stand.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunDecisionRequest'
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFlaggedRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`RUN_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`RUN_NOT_IN_REVIEW` - not flagged, not a clear, or already decided.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/notices:
    get:
      tags: [notices]
      operationId: getNotices
      summary: The notices showing now, with which this player has read.
      responses:
        '200':
          description: The notices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/notices/{noticeId}/read:
    post:
      tags: [notices]
      operationId: readNotice
      summary: Clear a notice's unread dot.
      parameters:
        - name: noticeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Marked read.
        '404':
          description: '`NOTICE_NOT_FOUND` - not showing.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/notices/banners/{name}:
    get:
      tags: [notices]
      operationId: getNoticeBanner
      summary: A banner image. Public; the name is the content's hash, so it caches forever.
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]+\.(png|jpg)$'
      responses:
        '200':
          description: The image.
          content:
            image/png: {}
            image/jpeg: {}
        '404':
          description: No such banner.

  /v1/admin/items:
    get:
      tags: [admin]
      operationId: listItems
      summary: Every item the game knows, by id and name - for the admin page's item pickers.
      description: |
        Read from server/data/items.json, which Arknights/Depot/Export Item Catalog writes from
        the game's ItemMetas; ci/check_items.py keeps the two in step.
      responses:
        '200':
          description: The items, by id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCatalogList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/notices:
    get:
      tags: [admin]
      operationId: listNotices
      summary: Every notice, showing or not.
      responses:
        '200':
          description: The notices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNoticeList'
    post:
      tags: [admin]
      operationId: createNotice
      summary: Create a notice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeUpsertRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotice'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/admin/notices/{noticeId}:
    put:
      tags: [admin]
      operationId: updateNotice
      summary: Save a new version of a notice (If-Match).
      parameters:
        - name: noticeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeUpsertRequest'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotice'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /v1/admin/notices/banners:
    post:
      tags: [admin]
      operationId: uploadNoticeBanner
      summary: Upload a banner or a picture for a notice's blocks - PNG or JPEG, judged by its bytes, at most 2 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerUpload'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/sign-in:
    get:
      tags: [sign-in]
      operationId: getSignIn
      summary: This month's squares and how far this player is.
      responses:
        '200':
          description: The month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInMonth'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [sign-in]
      operationId: signIn
      summary: Claim today's square.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`NOTHING_TO_CLAIM` - signed today already, or every square is taken.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/sign-in:
    get:
      tags: [admin]
      operationId: listSignInTables
      summary: The default table and every month's own.
      responses:
        '200':
          description: The tables.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInTables'

  /v1/admin/sign-in/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          description: '"default" or a month as yyyy-MM.'
    put:
      tags: [admin]
      operationId: saveSignInTable
      summary: Save the default (exactly 31 squares) or a month's table (at least its days, at most 31).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInTableRequest'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInTable'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [admin]
      operationId: deleteSignInTable
      summary: Remove a month's table so it uses the default. The default stays.
      responses:
        '204':
          description: Removed.
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/missions:
    get:
      tags: [missions]
      operationId: getMissionBoards
      summary: Both boards, with progress and what can be claimed.
      description: |
        重置是隐含的 / The reset is implicit rather than scheduled. A board's period key
        is part of the identity of every counter and claim, so a new day is a new key, a
        new key has no rows, and no row reads as zero. There is no job to wipe anything -
        and therefore no job that can fail to run.

        `resetsAt` is when the current board ends, in UTC. The boundary is 04:00 in the
        players' own timezone, which is arithmetic that has no business being on a device
        whose clock is attacker-controlled.
      responses:
        '200':
          description: Both boards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionBoards'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/missions/claims:
    post:
      tags: [missions]
      operationId: claimMission
      summary: Take a finished mission's points.
      description: |
        Pays points, not items. `granted` is empty.

        存在即已领 / Claiming twice is refused by a primary key on
        (account, tab, mission, period) rather than by a check that could race.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimMissionRequest'
      responses:
        '200':
          description: Claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`MISSION_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            `MISSION_NOT_COMPLETE`, or `ALREADY_CLAIMED`. The second is not the player's
            mistake - two taps on a slow connection land there - so a client should
            refresh the board rather than say anything alarming.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/missions/reward-claims:
    post:
      tags: [missions]
      operationId: claimMissionReward
      summary: Take a reward the claimed points have unlocked.
      description: |
        The claim row and the items move together - a crash between them would either
        pay twice or pay nothing.

        Thresholds count points that have been CLAIMED, not merely earned.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRewardRequest'
      responses:
        '200':
          description: Claimed, and the items are in the bag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`MISSION_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`NOT_ENOUGH_POINTS`, or `ALREADY_CLAIMED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived access token from any `/v1/auth/*` sign-in. Carries the player id
        and nothing the client is trusted to assert - no level, no balances. Anything
        the server needs in order to decide is read server-side, or it is not a
        decision the server is actually making.

  parameters:
    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: |
        The game build sending the request, "major.minor.patch". Older than the config's
        `minClientVersion` is refused with 426 `CLIENT_OUTDATED` on every endpoint but
        `/v1/config`, health and admin. Absent: not checked.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: |
        Client-generated UUID, stable across retries of the *same* logical request and
        different for a new one. The server stores it against the response for 24 hours
        and replays that response rather than acting twice.

        The same key with a *different* body answers 409 with code
        IDEMPOTENCY_KEY_CONFLICT - that is not a retry, and replying with the first
        response would answer a question that was not asked. A missing key answers 400.

        The guarantee is a unique index on (key, endpoint), not a lookup: two
        concurrent retries both read nothing and both proceed, and the database is what
        refuses the second write.

    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: |
        The `ETag` from the last `GET /v1/players/me`. A mismatch is `412`; absent is
        `428`. Required rather than optional on purpose - an optional precondition is
        one the client forgets, and the bug surfaces as a player losing progress on
        their second device.

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: Answer `304` if the state still matches this ETag.

  headers:
    ETag:
      schema:
        type: string
      description: Opaque version of the player state. Send back as `If-Match`.
    RetryAfter:
      schema:
        type: integer
      description: Seconds to wait before retrying.

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unauthorized:
      description: Missing, expired or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ValidationFailed:
      description: Well-formed but semantically wrong. `errors` names the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.promuse.example/problems/validation-failed
            title: Validation failed
            status: 422
            code: VALIDATION_FAILED
            errors:
              squad:
                - AMIYA appears in slot 0 and slot 2.

    PreconditionFailed:
      description: |
        The state changed since the ETag was issued - another device wrote first. The
        client re-reads and shows the conflict; it does not merge silently.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    PreconditionRequired:
      description: The write needs an `If-Match` and did not carry one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ServiceUnavailable:
      description: |
        `MAINTENANCE` (the game is closed; `detail` is the operator's message and Retry-After is
        set when an end time is known) or `FEATURE_DISABLED` (the feature behind this endpoint is
        switched off by remote config).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ClientOutdated:
      description: '`CLIENT_OUTDATED` - this build is older than the minimum the config accepts.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalError:
      description: |
        Unexpected server fault. `traceId` correlates with the server log; nothing
        about the internals is ever exposed in `detail`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: |
            Stable machine-readable discriminator. The client switches on this, never
            on `title` or `detail`, which are free to be reworded or localised.
          examples: [USERNAME_TAKEN, INVALID_CREDENTIALS, STATE_CONFLICT]
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        traceId:
          type: string

    GuestSignInRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            Stable per install. Identifies the device, and is **not** a credential - it
            is guessable, so it grants a guest session and nothing an account holds.

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
          pattern: '^[A-Za-z0-9_]+$'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: |
            Sent over TLS, hashed with Argon2id on arrival, never stored in the clear,
            never logged, never echoed back in any response.
        deviceId:
          type: string
          description: Optional. Links this device to the new account at creation.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenPair:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds. Short by design - revocation leans on this.
          examples: [900]
        refreshToken:
          type: string
        refreshExpiresIn:
          type: integer
          examples: [2592000]

    AuthSession:
      type: object
      required: [playerId, isGuest, tokens, serverTime]
      properties:
        playerId:
          type: string
          format: uuid
        isGuest:
          type: boolean
          description: True until `/v1/auth/link` attaches credentials.
        tokens:
          $ref: '#/components/schemas/TokenPair'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    ServerTime:
      type: string
      format: date-time
      description: |
        Authoritative clock. Every deadline the game enforces is derived from this, so
        that changing the device clock changes nothing.

    PlayerState:
      type: object
      required:
        - playerId
        - displayName
        - tag
        - level
        - exp
        - expToNextLevel
        - stamina
        - characters
        - squad
        - inventory
        - stateVersion
        - serverTime
      properties:
        playerId:
          type: string
          format: uuid
        displayName:
          type: string
        tag:
          $ref: '#/components/schemas/PlayerTag'
        level:
          type: integer
          minimum: 1
          maximum: 120
          description: Cap matches `PlayerData.GetMaxLevel()`.
        exp:
          type: integer
          minimum: 0
        expToNextLevel:
          type: integer
          description: |
            From `PlayerData.GetMaxExp(level)`. Computed server-side and sent, rather
            than recomputed by the client, so retuning the curve needs no app update
            and the two can never disagree.
        stamina:
          $ref: '#/components/schemas/Stamina'
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterState'
        squad:
          $ref: '#/components/schemas/Squad'
        desktopCharacterId:
          type: [string, 'null']
        signature:
          type: [string, 'null']
          description: The line on the player's profile card, as the server kept it.
        signatureLockedUntil:
          type: [string, 'null']
          format: date-time
          description: |
            While a moderator has locked the line, when the player may write it again;
            `9999-01-01T00:00:00Z` is a lock only a moderator lifts. Null when not locked.
        inventory:
          type: array
          items:
            $ref: '#/components/schemas/ItemStack'
        stateVersion:
          type: integer
          description: |
            Increments on every accepted write. The same value the `ETag` encodes,
            surfaced in the body so a conflict can be explained to the player rather
            than only handled by the transport.
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    Stamina:
      type: object
      description: |
        `PlayerData.reason` (理智). Regenerates with wall-clock time, so the server owns
        it outright.
      required: [current, max]
      properties:
        current:
          type: integer
          minimum: 0
        max:
          type: integer
          description: From `PlayerData.GetMaxReason(level)`.
        nextPointAt:
          type: [string, 'null']
          format: date-time
          description: When the next point lands. Null at full.
        fullAt:
          type: [string, 'null']
          format: date-time

    CharacterState:
      type: object
      description: Mirrors `Data.Char.CharData`.
      required: [characterId, elite, level, exp, trust]
      properties:
        characterId:
          type: string
          examples: [AMIYA, NOVA, ECHO, PULSE]
          description: |
            Matches the ids under `Resources/Meta/Char`. Only the player's progression
            lives here - artwork, rarity and stats stay client-side content, so a
            balance change is a content update and not a database migration.
        elite:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
        exp:
          type: integer
          minimum: 0
        trust:
          type: integer
          minimum: 0

    Squad:
      type: array
      minItems: 4
      maxItems: 4
      description: |
        Always four entries, `null` for empty - the shape `PlayerData.GetSquad()`
        normalises to. Fixed length rather than a list of filled slots, because the
        slot position is meaningful.
      items:
        type: [string, 'null']

    ItemStack:
      type: object
      description: Mirrors `Data.Item.ItemStack`.
      required: [itemId, amount]
      properties:
        itemId:
          type: integer
          description: Ids from `Resources/Meta/Item` - 1 Orundum, 2 LMD, 6 Orirock.
        amount:
          type: integer
          minimum: 1

    SquadRequest:
      type: object
      required: [squad]
      properties:
        squad:
          $ref: '#/components/schemas/Squad'

    DesktopCharacterRequest:
      type: object
      required: [characterId]
      properties:
        characterId:
          type: [string, 'null']
          description: Null clears it. Must be a character the player owns.

    SignatureRequest:
      type: object
      required: [signature]
      properties:
        signature:
          type: [string, 'null']
          description: At most 60 characters. Null or blank clears it.
          examples: ['Music every day']

    LevelUpRequest:
      type: object
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          description: |
            Battle records by item id and count, each id once: 11 Basic (200 EXP),
            14 Frontline (400), 15 Tactical (1000), 16 Strategic (2000).
          items:
            $ref: '#/components/schemas/ItemStack'

    LevelUpResult:
      type: object
      required: [characterId, fromLevel, toLevel, expApplied, lmdSpent, player]
      properties:
        characterId:
          type: string
        fromLevel:
          type: integer
        toLevel:
          type: integer
        expApplied:
          type: integer
          description: The EXP that went into the operator; overflow past the cap is not counted.
        lmdSpent:
          type: integer
        player:
          $ref: '#/components/schemas/PlayerState'

    PromoteRequest:
      type: object
      required: [toElite]
      properties:
        toElite:
          type: integer
          minimum: 1
          description: |
            Always one past the operator's own phase. Naming any other is refused, so a
            second promotion sent from a screen that had not seen the first is not taken.

    PromoteResult:
      type: object
      required: [characterId, fromElite, toElite, level, maxLevel, spent, player]
      properties:
        characterId:
          type: string
        fromElite:
          type: integer
        toElite:
          type: integer
        level:
          type: integer
          description: Unchanged by promotion.
        maxLevel:
          type: integer
          description: The new cap.
        spent:
          type: array
          items:
            $ref: '#/components/schemas/ItemStack'
        player:
          $ref: '#/components/schemas/PlayerState'

    PlayerTag:
      type: integer
      minimum: 0
      maximum: 9999
      description: |
        The four digits after the name, drawn as `#0420`. Names repeat - every guest is
        "Doctor" and a number - but a name and its tag never do. Drawn at random when
        the player is created and never changed.

    PlayerProfile:
      type: object
      description: |
        A profile card, as everyone who opens it sees it - its owner included.
        Everything here is public.
      required:
        - playerId
        - displayName
        - tag
        - level
        - assistantId
        - registeredAt
        - operators
        - rhythm
        - isSelf
      properties:
        playerId:
          type: string
          format: uuid
        displayName:
          type: string
        tag:
          $ref: '#/components/schemas/PlayerTag'
        level:
          type: integer
          minimum: 1
        signature:
          type: [string, 'null']
          description: The line the player wrote on their card. Null when there is none.
        assistantId:
          type: string
          description: |
            The operator standing on the card: the assistant the player chose
            (`desktopCharacterId`), or `AMIYA` until they choose - the same one Home
            shows. AMIYA is every new account's starting operator.
        registeredAt:
          type: string
          format: date-time
        campaignProgress:
          type: [string, 'null']
          description: |
            The code of the furthest main-campaign stage cleared, in play order - such
            as `1-4`. Null before the first clear.
          examples: ['1-4']
        operators:
          type: integer
          minimum: 0
          description: How many operators the player owns.
        rhythm:
          $ref: '#/components/schemas/RhythmRecord'
        isSelf:
          type: boolean
          description: The card is the caller's own, so its signature may be edited.

    RhythmRecord:
      type: object
      description: The rhythm side of a card, counted from results the server accepted.
      required: [plays, songsCleared, fullCombos]
      properties:
        plays:
          type: integer
          minimum: 0
          description: Runs finished, won or lost.
        songsCleared:
          type: integer
          minimum: 0
          description: Different charts cleared at least once. A rejected result is not a clear.
        fullCombos:
          type: integer
          minimum: 0
          description: Different charts cleared with a full combo.
        bestScore:
          type: [integer, 'null']
          description: |
            The highest ranked score on any chart - the same number as the player's best
            all-time board line. Null before the first.

    ShopOffer:
      type: object
      required: [offerId, sellItemId, sellAmount, priceItemId, priceAmount]
      properties:
        offerId:
          type: string
          format: uuid
        sellItemId:
          type: integer
          description: What the player receives. An id from Resources/Meta/Item.
        sellAmount:
          type: integer
          minimum: 1
        priceItemId:
          type: integer
          description: What they pay with - 6 (Orirock), or 8 (Purchase Certificate) for the offers that spend duplicate headhunting results.
        priceAmount:
          type: integer
          minimum: 1

    ShopCatalog:
      type: object
      required: [offers, serverTime]
      properties:
        offers:
          type: array
          items:
            $ref: '#/components/schemas/ShopOffer'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    PurchaseRequest:
      type: object
      required: [offerId, quantity]
      properties:
        offerId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: |
            How many of the offer, in one checkout. The cap matches the client's own.
            No total price is sent: a total the client computed is a total the client
            can choose.

    PurchaseResult:
      type: object
      required: [purchaseId, granted, charged, player]
      properties:
        purchaseId:
          type: string
          format: uuid
          description: The ledger row, so a player can be told where their currency went.
        granted:
          $ref: '#/components/schemas/ItemStack'
        charged:
          $ref: '#/components/schemas/ItemStack'
        player:
          $ref: '#/components/schemas/PlayerState'

    StartRunRequest:
      type: object
      required: [stageId, characterId]
      properties:
        stageId:
          type: string
          maxLength: 64
          description: The chart being attempted, from `SongChart.stageId`.
        characterId:
          type: string
          maxLength: 32
          description: The operator, which must be on the player's roster.
        eventId:
          type: [string, 'null']
          maxLength: 64
          description: Set when the chart is played as a stage of this event, from the event screen.
        campaignStageId:
          type: [string, 'null']
          maxLength: 64
          description: |
            Set when the chart is played as this stage of the main campaign. Refused while the stage
            is locked (`STAGE_LOCKED`) or when it plays another chart; never together with eventId.

    RunTicket:
      type: object
      required: [runId, stageId, seed, staminaSpent, player, serverTime, characterLevel]
      properties:
        runId:
          type: string
          format: uuid
        stageId:
          type: string
        seed:
          type: integer
          format: int64
          description: |
            服务端发, 从不接收 / Issued by the server and never accepted from the
            client. JudgeUpgradePassive rolls per judgement, so the scoring rules are
            not deterministic and the server cannot re-simulate a run without knowing
            the sequence. If the client chose this number it would simply re-roll until
            the draw was favourable.

            The client seeds the run's own generator (`RunState.NextRoll`, SplitMix64)
            from this - never UnityEngine.Random, which the rest of the scene also
            draws from.
        staminaSpent:
          type: integer
          minimum: 0
        player:
          $ref: '#/components/schemas/PlayerState'
        serverTime:
          $ref: '#/components/schemas/ServerTime'
        characterLevel:
          type: integer
          minimum: 1
          description: |
            The operator's level as the server recorded it when the run opened. An
            operator's stats grow with its level, so the run is played at this level and
            reviewed at it - a level-up landing while the song plays changes nothing.

    MissionTab:
      type: string
      enum: [Daily, Weekly]
      description: |
        枚举用名字 / Serialised as the name, not an ordinal. An ordinal silently remaps
        every stored and in-flight value when someone reorders the enum, and these names
        are also written into the period keys held per player.

    MissionGoal:
      type: string
      enum: [PlaySong, BuyShopItem]
      description: |
        What a mission counts. A closed set on purpose: each value needs a server-side
        place that advances it, and a goal nothing advances is a mission nobody can
        finish. `PlaySong` advances on a WON run completion; `BuyShopItem` on a checkout,
        once per checkout rather than once per unit.

    MissionState:
      type: object
      required: [missionId, description, goal, target, progress, points, isComplete, isClaimed]
      properties:
        missionId:
          type: string
        description:
          type: string
        goal:
          $ref: '#/components/schemas/MissionGoal'
        target:
          type: integer
          minimum: 1
        progress:
          type: integer
          description: Capped at the target, so a bar never overfills.
        points:
          type: integer
          description: What claiming this mission pays into the board total.
        isComplete:
          type: boolean
        isClaimed:
          type: boolean
          description: |
            做完和领了是两回事 / Finished and claimed are different states. An unclaimed
            mission is worth no points yet, which is the whole point of the manual step.

    RewardState:
      type: object
      required: [rewardId, requiredPoints, itemId, amount, isClaimed, isClaimable]
      properties:
        rewardId:
          type: string
        requiredPoints:
          type: integer
          description: Points that must have been CLAIMED, not merely earned.
        itemId:
          type: integer
        amount:
          type: integer
          minimum: 1
        isClaimed:
          type: boolean
        isClaimable:
          type: boolean
          description: Computed server-side, so the client never re-derives the rule.

    MissionBoard:
      type: object
      required: [tab, title, points, resetsAt, missions, rewards]
      properties:
        tab:
          $ref: '#/components/schemas/MissionTab'
        title:
          type: string
        points:
          type: integer
        resetsAt:
          type: string
          format: date-time
          description: |
            When this board empties, in UTC. The boundary is 04:00 in the players' own
            timezone; the client counts down from this rather than working that out on a
            clock the player controls.
        missions:
          type: array
          items:
            $ref: '#/components/schemas/MissionState'
        rewards:
          type: array
          items:
            $ref: '#/components/schemas/RewardState'

    MissionBoards:
      type: object
      required: [daily, weekly, serverTime]
      properties:
        daily:
          $ref: '#/components/schemas/MissionBoard'
        weekly:
          $ref: '#/components/schemas/MissionBoard'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    ClaimMissionRequest:
      type: object
      required: [tab, missionId]
      properties:
        tab:
          $ref: '#/components/schemas/MissionTab'
        missionId:
          type: string

    ClaimRewardRequest:
      type: object
      required: [tab, rewardId]
      properties:
        tab:
          $ref: '#/components/schemas/MissionTab'
        rewardId:
          type: string

    ClaimResult:
      type: object
      required: [granted, boards, player]
      properties:
        granted:
          type: array
          description: Empty for a mission claim, which pays points rather than items.
          items:
            $ref: '#/components/schemas/ItemStack'
        boards:
          $ref: '#/components/schemas/MissionBoards'
        player:
          $ref: '#/components/schemas/PlayerState'

    CompleteRunRequest:
      type: object
      required: [won]
      properties:
        won:
          type: boolean
          description: |
            通关才算 / Only a win advances the "clear any song" missions, matching what
            GameManager already did: a run that ran out of HP is not a clear.
        result:
          oneOf:
            - $ref: '#/components/schemas/RunResult'
            - type: 'null'
          description: Required when `won` is true. Optional for a failed run.

    RunResult:
      type: object
      required: [score, maxCombo, perfect, great, hit, miss, fullCombo, rulesetFingerprint, trace]
      description: |
        What the device says happened, and the raw input it happened from. Counts are
        named after the Judgement enum; the results screen's "good" and "normal" are older
        labels for Great and Hit.
      properties:
        score:
          type: integer
          minimum: 0
        maxCombo:
          type: integer
          minimum: 0
        perfect:
          type: integer
          minimum: 0
        great:
          type: integer
          minimum: 0
        hit:
          type: integer
          minimum: 0
        miss:
          type: integer
          minimum: 0
        fullCombo:
          type: boolean
        rulesetFingerprint:
          type: string
          maxLength: 32
          description: |
            `RulesetFingerprint.Compute` over the rules the run was played with: a 64-bit
            FNV-1a of every scoring number, floats hashed by their IEEE bits. A mismatch is
            the device and the server disagreeing about the rules, and is answered as
            `RULESET_MISMATCH` rather than as an impossible score.
        trace:
          type: string
          maxLength: 2097152
          description: |
            The input trace, gzipped then base64. One record per gameplay frame: the song
            time the frame was judged at, the lanes pressed and the lanes held. Kept by the
            server so the run can be replayed against its seed.

    ScoreVerdict:
      type: string
      enum: [Accepted, Flagged, Rejected]

    ScoreReview:
      type: object
      required: [verdict, reasons, score, isPersonalBest]
      properties:
        verdict:
          $ref: '#/components/schemas/ScoreVerdict'
        reasons:
          type: array
          description: |
            Empty when accepted. When rejected, any of `RULESET_MISMATCH`, `TRACE_MISSING`,
            `TRACE_INVALID`, `TRACE_INCOMPLETE`, `COUNTS_INCONSISTENT`, `COMBO_INCONSISTENT`,
            `FULL_COMBO_INCONSISTENT`, `SCORE_ABOVE_CEILING`, `FINISHED_TOO_FAST`,
            `NOT_ENOUGH_INPUT`. When flagged, `UNDER_REVIEW` alone - which signal fired
            stays on the server.
          items:
            type: string
        score:
          type: integer
        isPersonalBest:
          type: boolean
          description: This run is now the player's all-time entry on the stage.
        allTimeRank:
          type: [integer, 'null']
          minimum: 1
        weeklyRank:
          type: [integer, 'null']
          minimum: 1

    RunCompletion:
      type: object
      required: [runId, won, boards, player, serverTime]
      properties:
        runId:
          type: string
          format: uuid
        won:
          type: boolean
          description: Whether the server counted a clear - the claim, unless rejected.
        review:
          oneOf:
            - $ref: '#/components/schemas/ScoreReview'
            - type: 'null'
          description: Null when no result was sent, which only a failed run may do.
        boards:
          $ref: '#/components/schemas/MissionBoards'
        player:
          $ref: '#/components/schemas/PlayerState'
        serverTime:
          $ref: '#/components/schemas/ServerTime'
        rewards:
          oneOf:
            - $ref: '#/components/schemas/RunRewards'
            - type: 'null'
          description: What a cleared run paid; null when it paid nothing (a failed or rejected run).

    RunRewards:
      type: object
      required: [firstClearOrundum, drops, exp, levelBefore, levelAfter, primeFromLevels]
      properties:
        firstClearOrundum:
          type: integer
        drops:
          type: array
          items:
            $ref: '#/components/schemas/ItemStack'
        exp:
          type: integer
        levelBefore:
          type: integer
        levelAfter:
          type: integer
        primeFromLevels:
          type: integer
          description: Originite Prime from the levels gained - each new level pays level / 5.

    LeaderboardPeriod:
      type: string
      enum: [AllTime, Weekly]
      default: AllTime

    LeaderboardEntry:
      type: object
      required: [rank, playerId, displayName, tag, score, maxCombo, achievedAt]
      properties:
        rank:
          type: integer
          minimum: 1
        playerId:
          type: string
          format: uuid
        displayName:
          type: string
        tag:
          $ref: '#/components/schemas/PlayerTag'
        score:
          type: integer
        maxCombo:
          type: integer
        characterId:
          type: [string, 'null']
          description: The operator the score was set with.
        achievedAt:
          type: string
          format: date-time

    LeaderboardPage:
      type: object
      required: [stageId, period, periodKey, entries, serverTime]
      properties:
        stageId:
          type: string
        period:
          $ref: '#/components/schemas/LeaderboardPeriod'
        periodKey:
          type: string
          description: '"all", or the ISO week such as "2026-W41".'
        resetsAt:
          type: [string, 'null']
          format: date-time
          description: When the weekly board moves to a new key. Null for all-time.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        me:
          oneOf:
            - $ref: '#/components/schemas/LeaderboardEntry'
            - type: 'null'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    GachaPoolEntry:
      type: object
      required: [characterId, rarity, duplicateItemId, duplicateAmount]
      properties:
        characterId:
          type: string
        rarity:
          type: integer
          minimum: 3
          maximum: 5
          description: The server's rarity - the tier this operator is drawn under.
        duplicateItemId:
          type: integer
          description: What a copy the player already owns becomes. Purchase Certificate (8) today.
        duplicateAmount:
          type: integer
          minimum: 1

    GachaBannerInfo:
      type: object
      required: [bannerId, rateFiveStar, rateFourStar, rateThreeStar, pityThreshold, currencyItemId,
                 costSingle, costMulti, pool, pullsSinceFiveStar]
      properties:
        bannerId:
          type: string
          description: Stable; the client matches its art to it and pity is keyed by it.
        startsAt:
          type: [string, 'null']
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time
          description: Null for a permanent banner.
        rateFiveStar:
          type: integer
          description: Basis points - 200 is 2.00%. The three rates add up to exactly 10000.
        rateFourStar:
          type: integer
        rateThreeStar:
          type: integer
        pityThreshold:
          type: integer
          minimum: 1
        currencyItemId:
          type: integer
        costSingle:
          type: integer
          minimum: 1
        costMulti:
          type: integer
          minimum: 1
        ticketItemId:
          type: [integer, 'null']
          description: Spent first, one per pull, when the player holds enough for the whole request.
        pool:
          type: array
          description: Rarest first.
          items:
            $ref: '#/components/schemas/GachaPoolEntry'
        pullsSinceFiveStar:
          type: integer
          minimum: 0

    GachaBannerList:
      type: object
      required: [banners, serverTime]
      properties:
        banners:
          type: array
          items:
            $ref: '#/components/schemas/GachaBannerInfo'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    GachaPullRequest:
      type: object
      required: [bannerId, times]
      properties:
        bannerId:
          type: string
        times:
          type: integer
          enum: [1, 10]

    GachaPullOutcome:
      type: object
      required: [characterId, rarity, isNew, guaranteed]
      properties:
        characterId:
          type: string
        rarity:
          type: integer
        isNew:
          type: boolean
          description: The player did not own this operator before.
        converted:
          oneOf:
            - $ref: '#/components/schemas/ItemStack'
            - type: 'null'
          description: What the copy became; null when it was new.
        guaranteed:
          type: boolean
          description: Given by the pity count rather than the odds.

    GachaPullResult:
      type: object
      required: [batchId, bannerId, pulls, charged, pullsSinceFiveStar, player]
      properties:
        batchId:
          type: string
          format: uuid
        bannerId:
          type: string
        pulls:
          type: array
          items:
            $ref: '#/components/schemas/GachaPullOutcome'
        charged:
          $ref: '#/components/schemas/ItemStack'
        pullsSinceFiveStar:
          type: integer
        player:
          $ref: '#/components/schemas/PlayerState'

    GachaHistoryEntry:
      type: object
      required: [sequence, batchId, bannerId, characterId, rarity, isNew, pulledAt]
      properties:
        sequence:
          type: integer
          format: int64
        batchId:
          type: string
          format: uuid
        bannerId:
          type: string
        characterId:
          type: string
        rarity:
          type: integer
        isNew:
          type: boolean
        pulledAt:
          type: string
          format: date-time

    GachaHistoryPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/GachaHistoryEntry'
        nextBefore:
          type: [integer, 'null']
          format: int64
          description: Pass as `before` for the next page; null on the last one.

    MaintenanceWindow:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        message:
          type: [string, 'null']
          maxLength: 300
          description: Shown to players while it is on.
        endsAt:
          type: [string, 'null']
          format: date-time
          description: The expected end, shown and sent as Retry-After.

    FeatureFlags:
      type: object
      required: [gacha, shop, ranked, leaderboards]
      description: Each one is enforced by the server on the endpoint behind it.
      properties:
        gacha:
          type: boolean
          description: POST /v1/gacha/pulls.
        shop:
          type: boolean
          description: POST /v1/shop/purchases.
        ranked:
          type: boolean
          description: POST /v1/runs. Completing a run already open is never refused.
        leaderboards:
          type: boolean
          description: GET /v1/leaderboards/{stageId}. Scores are still recorded while off.

    ConfigDocument:
      type: object
      required: [maintenance, minClientVersion, features]
      properties:
        maintenance:
          $ref: '#/components/schemas/MaintenanceWindow'
        minClientVersion:
          type: string
          examples: ['1.0.0']
        features:
          $ref: '#/components/schemas/FeatureFlags'
        announcement:
          type: [string, 'null']
          maxLength: 300
          description: Shown once per version on the Home screen.
        expPerSanity:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000
          description: Player EXP per point of Sanity a cleared ranked run cost; null for the default, 12.

    RemoteConfig:
      type: object
      required: [version, document, updatedAt, serverTime]
      properties:
        version:
          type: integer
          description: Also the ETag.
        document:
          $ref: '#/components/schemas/ConfigDocument'
        updatedAt:
          type: string
          format: date-time
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    ConfigUpdateRequest:
      type: object
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/ConfigDocument'
        note:
          type: [string, 'null']
          maxLength: 200

    ConfigRollbackRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
        note:
          type: [string, 'null']
          maxLength: 200

    ConfigRevision:
      type: object
      required: [version, document, createdAt]
      properties:
        version:
          type: integer
        document:
          $ref: '#/components/schemas/ConfigDocument'
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: [string, 'null']
          description: The administrator's username; null for the seeded first version.
        note:
          type: [string, 'null']
        rolledBackFrom:
          type: [integer, 'null']

    ConfigHistory:
      type: object
      required: [revisions]
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/ConfigRevision'

    EventGoal:
      type: string
      enum: [PlaySong, BuyShopItem, ClearStage, ReachScore, Headhunt]
      description: |
        PlaySong - any clear. ClearStage - a clear of the mission's stageId. ReachScore - an
        accepted result at or above minScore (on stageId if set). BuyShopItem - a store checkout.
        Headhunt - pulls, a ten-pull counting ten.

    EventReward:
      type: object
      required: [itemId, amount]
      properties:
        itemId:
          type: integer
        amount:
          type: integer
          minimum: 1

    CheckInDay:
      type: object
      required: [day, reward]
      properties:
        day:
          type: integer
          minimum: 1
        reward:
          $ref: '#/components/schemas/EventReward'

    EventMission:
      type: object
      required: [missionId, description, goal, target, points]
      properties:
        missionId:
          type: string
        description:
          type: string
        goal:
          $ref: '#/components/schemas/EventGoal'
        target:
          type: integer
          minimum: 1
        points:
          type: integer
          minimum: 0
        stageId:
          type: [string, 'null']
        minScore:
          type: [integer, 'null']

    EventMilestone:
      type: object
      required: [rewardId, requiredPoints, reward]
      properties:
        rewardId:
          type: string
        requiredPoints:
          type: integer
          minimum: 1
        reward:
          $ref: '#/components/schemas/EventReward'

    EventShopOffer:
      type: object
      required: [offerId, sell, price]
      properties:
        offerId:
          type: string
        sell:
          $ref: '#/components/schemas/EventReward'
        price:
          type: integer
          minimum: 1
          description: In the event currency.
        limit:
          type: [integer, 'null']
          description: Per player over the whole event; null for no limit.

    EventStage:
      type: object
      description: |
        One of the event's own stages. They unlock in list order - each when the one before it
        has been cleared from the event screen.
      required: [stageId, currencyPerClear]
      properties:
        stageId:
          type: string
        currencyPerClear:
          type: integer
          minimum: 1
        title:
          type: [string, 'null']
          maxLength: 24
          description: What the stage is called on the event screen; null shows the chart's name.
        storyBefore:
          type: [string, 'null']
          pattern: '^[a-z0-9_]{1,64}$'
          description: A story script in the game (Resources/Story/<id>.story), played before the stage the first time.
        storyAfter:
          type: [string, 'null']
          pattern: '^[a-z0-9_]{1,64}$'
          description: Played after the stage's first clear.

    EventStageState:
      type: object
      required: [stage, isUnlocked, isCleared]
      properties:
        stage:
          $ref: '#/components/schemas/EventStage'
        isUnlocked:
          type: boolean
        isCleared:
          type: boolean

    EventDefinition:
      type: object
      required: [title, startsAt, endsAt, isActive, checkIn, missions, milestones, shop, stages]
      properties:
        title:
          type: string
          maxLength: 60
        subtitle:
          type: [string, 'null']
        description:
          type: [string, 'null']
          maxLength: 500
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        isActive:
          type: boolean
        currencyItemId:
          type: [integer, 'null']
          description: Required when the event has a shop or stages.
        bannerId:
          type: [string, 'null']
        checkIn:
          type: array
          items:
            $ref: '#/components/schemas/CheckInDay'
        missions:
          type: array
          items:
            $ref: '#/components/schemas/EventMission'
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/EventMilestone'
        shop:
          type: array
          items:
            $ref: '#/components/schemas/EventShopOffer'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/EventStage'

    EventSummary:
      type: object
      required: [eventId, title, startsAt, endsAt, isOpen]
      properties:
        eventId:
          type: string
        title:
          type: string
        subtitle:
          type: [string, 'null']
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        isOpen:
          type: boolean

    EventList:
      type: object
      required: [events, serverTime]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    CheckInState:
      type: object
      required: [claimed, canClaimToday, nextDayAt]
      properties:
        claimed:
          type: integer
        canClaimToday:
          type: boolean
        nextDayAt:
          type: string
          format: date-time

    EventMissionState:
      type: object
