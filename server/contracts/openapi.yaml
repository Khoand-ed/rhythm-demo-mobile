      properties:
        mission:
          $ref: '#/components/schemas/EventMission'
        progress:
          type: integer
        isComplete:
          type: boolean
        isClaimed:
          type: boolean

    EventMilestoneState:
      type: object
      required: [milestone, isClaimed, isClaimable]
      properties:
        milestone:
          $ref: '#/components/schemas/EventMilestone'
        isClaimed:
          type: boolean
        isClaimable:
          type: boolean

    EventShopState:
      type: object
      required: [offer, bought]
      properties:
        offer:
          $ref: '#/components/schemas/EventShopOffer'
        bought:
          type: integer
        remaining:
          type: [integer, 'null']

    EventView:
      type: object
      required: [eventId, definition, isOpen, currencyBalance, points, missions, milestones, shop, stages, serverTime]
      properties:
        eventId:
          type: string
        definition:
          $ref: '#/components/schemas/EventDefinition'
        isOpen:
          type: boolean
        currencyBalance:
          type: integer
        checkIn:
          oneOf:
            - $ref: '#/components/schemas/CheckInState'
            - type: 'null'
        points:
          type: integer
        missions:
          type: array
          items:
            $ref: '#/components/schemas/EventMissionState'
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/EventMilestoneState'
        shop:
          type: array
          items:
            $ref: '#/components/schemas/EventShopState'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/EventStageState'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    EventActionResult:
      type: object
      required: [granted, event, player]
      properties:
        granted:
          type: array
          items:
            $ref: '#/components/schemas/ItemStack'
        event:
          $ref: '#/components/schemas/EventView'
        player:
          $ref: '#/components/schemas/PlayerState'

    EventPurchaseRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    AdminEvent:
      type: object
      required: [eventId, version, definition, updatedAt]
      properties:
        eventId:
          type: string
        version:
          type: integer
          description: The If-Match for the next save.
        definition:
          $ref: '#/components/schemas/EventDefinition'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: [string, 'null']

    AdminEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AdminEvent'

    EventUpsertRequest:
      type: object
      required: [definition]
      properties:
        definition:
          $ref: '#/components/schemas/EventDefinition'

    EventCatalog:
      type: object
      required: [stageIds, bannerIds]
      properties:
        stageIds:
          type: array
          items:
            type: string
        bannerIds:
          type: array
          items:
            type: string

    StoryPatch:
      type: object
      required: [storyId, lineId, original, text]
      properties:
        storyId:
          type: string
        lineId:
          type: string
        original:
          type: string
          description: The text the correction was written against; applied only while the line still reads this.
        text:
          type: string

    StoryPatchList:
      type: object
      required: [revision, patches]
      properties:
        revision:
          type: integer
          description: Grows with every save and every take-back; the ETag.
        patches:
          type: array
          items:
            $ref: '#/components/schemas/StoryPatch'

    StoryPatchRequest:
      type: object
      required: [original, text]
      properties:
        original:
          type: string
          maxLength: 500
        text:
          type: string
          maxLength: 500

    AdminStoryPatch:
      type: object
      required: [storyId, lineId, original, text, revision, updatedAt]
      properties:
        storyId:
          type: string
        lineId:
          type: string
        original:
          type: string
        text:
          type: string
        revision:
          type: integer
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: [string, 'null']

    AdminStoryPatchList:
      type: object
      required: [patches]
      properties:
        patches:
          type: array
          items:
            $ref: '#/components/schemas/AdminStoryPatch'

    MailItem:
      type: object
      required: [mailId, title, body, sender, attachments, sentAt, expiresAt, isOpened]
      properties:
        mailId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        sender:
          type: string
        senderCharacterId:
          type: [string, 'null']
          description: An operator whose portrait signs the mail.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ItemStack'
        sentAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isOpened:
          type: boolean
          description: Opened - read, and its attachments collected.

    MailBox:
      type: object
      required: [mails, unopened, capacity, serverTime]
      properties:
        mails:
          type: array
          items:
            $ref: '#/components/schemas/MailItem'
        unopened:
          type: integer
        capacity:
          type: integer
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    MailActionResult:
      type: object
      required: [granted, box, player]
      properties:
        granted:
          type: array
          items:
            $ref: '#/components/schemas/ItemStack'
        box:
          $ref: '#/components/schemas/MailBox'
        player:
          $ref: '#/components/schemas/PlayerState'

    MailSendRequest:
      type: object
      required: [title, body, sender, attachments, expiresInDays]
      properties:
        title:
          type: string
          maxLength: 60
        body:
          type: string
          maxLength: 2000
        sender:
          type: string
          maxLength: 40
        senderCharacterId:
          type: [string, 'null']
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ItemStack'
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
        toUsername:
          type: [string, 'null']
          description: One player; null sends to every player who exists now.

    AdminMail:
      type: object
      required: [mailId, title, body, sender, attachments, sentAt, expiresAt, opened, isRetracted]
      properties:
        mailId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        sender:
          type: string
        senderCharacterId:
          type: [string, 'null']
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ItemStack'
        sentAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        toUsername:
          type: [string, 'null']
        sentBy:
          type: [string, 'null']
        opened:
          type: integer
        isRetracted:
          type: boolean

    AdminMailList:
      type: object
      required: [mails]
      properties:
        mails:
          type: array
          items:
            $ref: '#/components/schemas/AdminMail'

    AdminSignature:
      type: object
      required: [playerId, displayName, tag, removals]
      properties:
        playerId:
          type: string
          format: uuid
        displayName:
          type: string
        tag:
          $ref: '#/components/schemas/PlayerTag'
        signature:
          type: [string, 'null']
        signatureUpdatedAt:
          type: [string, 'null']
          format: date-time
          description: When the player last changed the line; null if never.
        lockedUntil:
          type: [string, 'null']
          format: date-time
          description: Until when the player cannot write a line (`9999-01-01T00:00:00Z` is until lifted); null when not locked.
        removals:
          type: integer
          description: How many times a moderator has taken this player's line down.

    AdminSignatureList:
      type: object
      required: [players]
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/AdminSignature'

    SignatureRemoveRequest:
      type: object
      required: [reason, lockDays, lockPermanently, notifyByMail]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Kept in the history and, when mailed, told to the player.
        lockDays:
          type: integer
          minimum: 0
          maximum: 365
          description: Days the player cannot write a new line; 0 is no lock.
        lockPermanently:
          type: boolean
          description: Locked until a moderator lifts it. Overrides lockDays.
        notifyByMail:
          type: boolean

    SignatureUnlockRequest:
      type: object
      properties:
        reason:
          type: [string, 'null']
          maxLength: 200

    SignatureModerationAction:
      type: string
      enum: [Removed, Unlocked]

    SignatureModerationEntry:
      type: object
      required: [id, playerId, displayName, tag, action, mailed, at]
      properties:
        id:
          type: integer
          format: int64
        playerId:
          type: string
          format: uuid
        displayName:
          type: string
        tag:
          $ref: '#/components/schemas/PlayerTag'
        action:
          $ref: '#/components/schemas/SignatureModerationAction'
        removedSignature:
          type: [string, 'null']
          description: The line as it stood when taken down.
        reason:
          type: [string, 'null']
        lockedUntil:
          type: [string, 'null']
          format: date-time
          description: The lock the action left in place.
        mailed:
          type: boolean
        by:
          type: [string, 'null']
          description: The moderator's username; null once that account is gone.
        at:
          type: string
          format: date-time

    SignatureModerationHistory:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SignatureModerationEntry'

    SignatureReportReason:
      type: string
      enum: [Spam, Offensive, Other]

    SignatureReportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/SignatureReportReason'
        note:
          type: [string, 'null']
          maxLength: 200

    AdminSignatureReport:
      type: object
      required: [id, reporterId, reporterName, reporterTag, reason, signature, at]
      properties:
        id:
          type: integer
          format: int64
        reporterId:
          type: string
          format: uuid
        reporterName:
          type: string
        reporterTag:
          $ref: '#/components/schemas/PlayerTag'
        reason:
          $ref: '#/components/schemas/SignatureReportReason'
        note:
          type: [string, 'null']
        signature:
          type: string
          description: The line as the reporter saw it; it may since have changed.
        at:
          type: string
          format: date-time

    AdminReportedPlayer:
      type: object
      required: [playerId, displayName, tag, removals, reports]
      properties:
        playerId:
          type: string
          format: uuid
        displayName:
          type: string
        tag:
          $ref: '#/components/schemas/PlayerTag'
        signature:
          type: [string, 'null']
          description: The line as it stands now; null when it is already gone.
        lockedUntil:
          type: [string, 'null']
          format: date-time
        removals:
          type: integer
        reports:
          type: array
          description: The open reports, oldest first.
          items:
            $ref: '#/components/schemas/AdminSignatureReport'

    AdminReportQueue:
      type: object
      required: [players]
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/AdminReportedPlayer'

    SignatureReportDismissRequest:
      type: object
      properties:
        note:
          type: [string, 'null']
          maxLength: 200

    RunReviewDecision:
      type: string
      enum: [Approved, Rejected]

    AdminRunNumbers:
      type: object
      required: [score, maxCombo, perfect, great, hit, miss, fullCombo, won]
      properties:
        score:
          type: integer
        maxCombo:
          type: integer
        perfect:
          type: integer
        great:
          type: integer
        hit:
          type: integer
        miss:
          type: integer
        fullCombo:
          type: boolean
        won:
          type: boolean
          description: Claimed as won, or a replay whose HP never ran out.

    AdminFlaggedRun:
      type: object
      required: [runId, playerId, displayName, tag, stageId, characterLevel, submittedAt, flags, claimed, presses, traceFrames]
      properties:
        runId:
          type: string
          format: uuid
        playerId:
          type: string
          format: uuid
        displayName:
          type: string
        tag:
          $ref: '#/components/schemas/PlayerTag'
        stageId:
          type: string
        songName:
          type: [string, 'null']
        characterId:
          type: [string, 'null']
        characterLevel:
          type: integer
        submittedAt:
          type: string
          format: date-time
        flags:
          type: array
          items:
            type: string
          description: REPLAY_MISMATCH, TIMING_FRAME_LOCKED, INPUT_SPAM or UNVERIFIABLE.
        claimed:
          $ref: '#/components/schemas/AdminRunNumbers'
        replay:
          oneOf:
            - $ref: '#/components/schemas/AdminRunNumbers'
            - type: 'null'
          description: What the server's replay counted; null when it could not run.
        ceiling:
          type: [integer, 'null']
        presses:
          type: integer
        traceFrames:
          type: integer
        timingSamples:
          type: [integer, 'null']
        timingMeanMs:
          type: [number, 'null']
        timingStdDevMs:
          type: [number, 'null']
        frameIntervalMs:
          type: [number, 'null']
        decision:
          oneOf:
            - $ref: '#/components/schemas/RunReviewDecision'
            - type: 'null'
        decisionNote:
          type: [string, 'null']
        decidedBy:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
          format: date-time
        rankedScore:
          type: [integer, 'null']
          description: The score an approval put on the boards.

    AdminFlaggedRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/AdminFlaggedRun'

    RunDecisionRequest:
      type: object
      properties:
        note:
          type: [string, 'null']
          maxLength: 200
          description: Required to reject (the player is mailed it), optional to approve.

    NoticeCategory:
      type: string
      enum: [Event, System, News]

    NoticeBlockType:
      type: string
      enum: [Text, Image]

    NoticeBlock:
      type: object
      description: One block of a notice as players see it - a paragraph, or a picture between paragraphs.
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/NoticeBlockType'
        text:
          type: [string, 'null']
          description: A Text block's TextMeshPro rich text.
        imageUrl:
          type: [string, 'null']
          description: An Image block's path on this server, served like a banner.

    NoticeBlockDefinition:
      type: object
      description: One block as the admin page writes it.
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/NoticeBlockType'
        text:
          type: [string, 'null']
          maxLength: 4000
        image:
          type: [string, 'null']
          description: A file name from the image upload.

    Notice:
      type: object
      required: [noticeId, category, listTitle, title, body, startsAt, sortOrder, isRead]
      properties:
        noticeId:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/NoticeCategory'
        listTitle:
          type: string
        title:
          type: string
        body:
          type: string
          description: |
            TextMeshPro rich text. For a notice in blocks, its paragraphs joined by a blank line -
            what a build from before blocks shows.
        bannerUrl:
          type: [string, 'null']
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time
        sortOrder:
          type: integer
        isRead:
          type: boolean
        blocks:
          type: [array, 'null']
          description: The content in order; null for a notice that is only its body.
          items:
            $ref: '#/components/schemas/NoticeBlock'

    NoticeList:
      type: object
      required: [notices, serverTime]
      properties:
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    NoticeDefinition:
      type: object
      required: [category, listTitle, title, body, startsAt, isActive, sortOrder]
      properties:
        category:
          $ref: '#/components/schemas/NoticeCategory'
        listTitle:
          type: string
          maxLength: 40
        title:
          type: string
          maxLength: 80
        body:
          type: string
          maxLength: 8000
          description: The text of a notice with no blocks. With blocks it is ignored and written from their paragraphs.
        banner:
          type: [string, 'null']
          description: A file name from the banner upload.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time
        isActive:
          type: boolean
        sortOrder:
          type: integer
        blocks:
          type: [array, 'null']
          description: |
            Paragraphs and pictures in order: at most 30 blocks and 10 pictures, at least one
            paragraph, each paragraph 1-4000 characters and 8000 together, each picture an
            uploaded file. Null or empty for a notice that is only its body.
          maxItems: 30
          items:
            $ref: '#/components/schemas/NoticeBlockDefinition'

    NoticeUpsertRequest:
      type: object
      required: [definition]
      properties:
        definition:
          $ref: '#/components/schemas/NoticeDefinition'

    AdminNotice:
      type: object
      required: [noticeId, version, definition, updatedAt]
      properties:
        noticeId:
          type: string
          format: uuid
        version:
          type: integer
        definition:
          $ref: '#/components/schemas/NoticeDefinition'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: [string, 'null']

    AdminNoticeList:
      type: object
      required: [notices]
      properties:
        notices:
          type: array
          items:
            $ref: '#/components/schemas/AdminNotice'

    BannerUpload:
      type: object
      required: [banner, url]
      properties:
        banner:
          type: string
        url:
          type: string

    CatalogItem:
      type: object
      required: [itemId, name, rarity]
      properties:
        itemId:
          type: integer
        name:
          type: string
        rarity:
          type: integer

    ItemCatalogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'

    SignInMonth:
      type: object
      required: [monthKey, year, month, rewards, signed, canSignToday, nextDayAt, serverTime]
      properties:
        monthKey:
          type: string
          example: 2026-10
        year:
          type: integer
        month:
          type: integer
        rewards:
          type: array
          description: One per day of the month, square 1 first.
          items:
            $ref: '#/components/schemas/ItemStack'
        signed:
          type: integer
        canSignToday:
          type: boolean
        nextDayAt:
          type: string
          format: date-time
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    SignInResult:
      type: object
      required: [day, granted, month, player]
      properties:
        day:
          type: integer
        granted:
          $ref: '#/components/schemas/ItemStack'
        month:
          $ref: '#/components/schemas/SignInMonth'
        player:
          $ref: '#/components/schemas/PlayerState'

    SignInTable:
      type: object
      required: [key, rewards, updatedAt]
      properties:
        key:
          type: string
        rewards:
          type: array
          items:
            $ref: '#/components/schemas/ItemStack'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: [string, 'null']

    SignInTables:
      type: object
      required: [tables]
      properties:
        tables:
          type: array
          items:
            $ref: '#/components/schemas/SignInTable'

    SignInTableRequest:
      type: object
      required: [rewards]
      properties:
        rewards:
          type: array
          items:
            $ref: '#/components/schemas/ItemStack'

    DropRarity:
      type: string
      enum: [Common, Uncommon, Rare]

    CampaignDrop:
      type: object
      required: [itemId, min, max, chance, rarity]
      properties:
        itemId:
          type: integer
        min:
          type: integer
          minimum: 1
        max:
          type: integer
        chance:
          type: integer
          minimum: 1
          maximum: 10000
          description: Basis points - 10000 always drops.
        rarity:
          $ref: '#/components/schemas/DropRarity'

    CampaignStage:
      type: object
      required: [stageId, code, chartId, firstClearOrundum, drops]
      properties:
        stageId:
          type: string
          pattern: '^[a-z0-9_]{1,64}$'
        code:
          type: string
          maxLength: 8
        chartId:
          type: string
        firstClearOrundum:
          type: integer
          minimum: 0
          maximum: 10000
        drops:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/CampaignDrop'
        storyBefore:
          type: [string, 'null']
        storyAfter:
          type: [string, 'null']

    CampaignChapter:
      type: object
      required: [chapterId, title, stages]
      properties:
        chapterId:
          type: string
        title:
          type: string
          maxLength: 60
        stages:
          type: array
          items:
            $ref: '#/components/schemas/CampaignStage'

    CampaignDefinition:
      type: object
      required: [chapters]
      properties:
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/CampaignChapter'

    CampaignStageState:
      type: object
      required: [stage, isUnlocked, isCleared, staminaCost]
      properties:
        stage:
          $ref: '#/components/schemas/CampaignStage'
        isUnlocked:
          type: boolean
        isCleared:
          type: boolean
        staminaCost:
          type: integer

    CampaignChapterState:
      type: object
      required: [chapterId, title, isUnlocked, stages]
      properties:
        chapterId:
          type: string
        title:
          type: string
        isUnlocked:
          type: boolean
        stages:
          type: array
          items:
            $ref: '#/components/schemas/CampaignStageState'

    CampaignView:
      type: object
      required: [chapters, serverTime]
      properties:
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/CampaignChapterState'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    AdminCampaign:
      type: object
      required: [version, definition, updatedAt]
      properties:
        version:
          type: integer
        definition:
          $ref: '#/components/schemas/CampaignDefinition'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: [string, 'null']

    CampaignUpsertRequest:
      type: object
      required: [definition]
      properties:
        definition:
          $ref: '#/components/schemas/CampaignDefinition'
