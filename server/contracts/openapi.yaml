openapi: 3.1.0

info:
  title: Promuse Backend API
  version: 1.0.0-draft.7
  summary: Authentication and player state for the Promuse mobile rhythm game.
  description: |
    **Phase 1** authentication, **Phase 2** player state, **Phase 3** the economy -
    shop, runs and missions, **Phase 4** scored results and leaderboards, then headhunting
    (gacha) with the server rolling the dice, and remote config for live operations. Each written
    before its implementation, so the client and the server are built against one
    agreement rather than the client being written against whatever the server happened
    to return.

    Every economy operation is server-authoritative and has its own endpoint rather
    than riding along on a player-state write. The client names what it wants; it never
    names a price, a balance, or a resulting inventory. The only writes that state a
    value outright are the two fields the client legitimately owns: the squad and the
    desktop character.

    Still absent: gacha, and replaying a run. A result is reviewed today against hard
    limits from the chart and the rules - counts, combo, a score ceiling, timing - and
    its raw input trace is kept, so the replay can be added to the same review without
    changing what the client sends.

    ## Where the data comes from

    The shapes below mirror `Assets/Arknights/Data/Player/PlayerData.cs`, which is what
    the game holds today as a ScriptableObject that nothing ever writes back. Field
    names are anglicised where the original is Chinese: `reason` (理智) is `stamina`
    here, because "reason" reads as a cause rather than a resource in English.

    ## Conventions that apply to every operation

    - **Versioning.** The major version is in the path (`/v1/...`). A breaking change
      opens `/v2` and both run side by side; a mobile client that has not updated must
      keep working, because a store rollout is neither instant nor reversible
      per-device.
    - **Errors** are RFC 9457 Problem Details (`application/problem+json`), never a
      bare string. `code` is the machine-readable discriminator the client switches on;
      `title` and `detail` are for humans and may be reworded without a version bump.
    - **Idempotency.** Every unsafe operation that creates or consumes something takes
      an `Idempotency-Key`. A mobile client on a train loses its response, not its
      request: without this, a retried sign-up creates a second account. The server
      stores the key with the response for 24 hours and replays it verbatim.
    - **Optimistic concurrency.** `GET /v1/players/me` returns an `ETag`; writes take
      `If-Match` and answer `412` when the state moved underneath. This is what stops
      two devices silently overwriting one another, and it is why `stateVersion` is in
      the body as well - the client shows the conflict, it does not resolve it alone.
    - **Time.** Every response carries `serverTime`, and every deadline the game
      enforces (stamina regeneration, daily reset) is computed from it. The device
      clock is attacker-controlled and is never an input.
    - **Rate limits** answer `429` with `Retry-After`. The client honours it rather
      than retrying on a schedule of its own.

tags:
  - name: auth
    description: |
      Sign-in, token rotation and account linking. Phase 1.

      The game opens straight into play with a guest session; credentials are attached
      later through `/v1/auth/link`. A rhythm game that demands a sign-up before the
      first note loses players at the only screen they have not yet enjoyed.
  - name: players
    description: Player state - the save that `PlayerData` never had. Phase 2.
  - name: shop
    description: |
      The economy, with the server holding the prices. Phase 3.
  - name: runs
    description: |
      One attempt at a song. Opened by `POST /v1/runs` with the operator fixed, closed by
      `POST /v1/runs/{runId}/complete` with the result and the input trace - one call for
      "it ended", so a run cannot be counted by one request and scored by another.
  - name: leaderboards
    description: |
      Each stage's best scores, all-time and this week. Phase 4.

      Written only by a run's completion, and only once its result was accepted. The
      weekly board is keyed by ISO week on the same Monday 04:00 boundary as the weekly
      missions, so it empties itself without a job.
  - name: gacha
    description: |
      Headhunting, with the server holding the odds, the pity counts and the dice.

      The client's banner asset keeps only presentation - title, text, which operator to
      draw large. The odds, the guarantee, the price, the schedule and the pool are served
      from here, so the Details screen can only ever print what the server actually rolls.
  - name: config
    description: |
      Remote config: maintenance, the minimum client version, feature flags and an announcement.

      Read anonymously by every client, before sign-in. Every switch is enforced by the server:
      maintenance answers 503 `MAINTENANCE` on every game endpoint (administrators pass), a
      request whose `X-Client-Version` is older than the minimum answers 426 `CLIENT_OUTDATED`,
      and a switched-off feature answers 503 `FEATURE_DISABLED` on the endpoint behind it.
  - name: admin
    description: |
      Changing remote config. Administrator accounts only - the flag is on the account and read
      on every request, never carried in the token. Every save is a new version; nothing is
      edited in place, so the history is the audit log and a rollback is a new version too.
  - name: missions
    description: |
      The two mission boards. Phase 3.

      三步, 一步都不自动 / Three steps and only the first happens on its own: a counter
      moves when the player does something, a finished mission pays its points when it
      is claimed, and points hand over items when a reward is claimed. Opening the
      board grants nothing.

servers:
  - url: http://localhost:8080
    description: Local development.
  - url: https://staging.api.promuse.example
    description: Staging.
  - url: https://api.promuse.example
    description: Production.

security:
  - bearerAuth: []

paths:
  /v1/auth/guest:
    post:
      tags: [auth]
      operationId: signInAsGuest
      summary: Open a session for a device with no account yet.
      description: |
        The first call for a given `deviceId` creates a player; later calls return the
        same one. Idempotent by `deviceId` as well as by `Idempotency-Key`, because a
        reinstall replays this with a fresh key against the same device.

        A guest session is a real session: it can play, save and appear on a
        leaderboard. What it cannot do is survive losing the device, which is what
        `/v1/auth/link` is for.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSignInRequest'
      responses:
        '200':
          description: Known device, session reopened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '201':
          description: New player created for this device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account with a username and password.
      description: |
        Replaces `PlayerManager.Register`, which held new accounts in a `List` in
        memory and lost them when the app closed.

        The password is hashed with Argon2id server-side and is never stored, logged or
        returned. `409` when the username is taken - the case
        `PlayerManager.Register` threw an exception for.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          description: That username is already taken.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.promuse.example/problems/username-taken
                title: Username already taken
                status: 409
                code: USERNAME_TAKEN
                detail: That username is already taken.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with a username and password.
      description: |
        Replaces the plaintext comparison in `PlayerManager.Login`, which read two
        seeded `ScriptableObject`s out of `Resources/Data/User`.

        A wrong username and a wrong password return the identical `401` and the
        identical `code`. Distinguishing them tells an attacker which usernames exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Wrong username or password - deliberately indistinguishable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.promuse.example/problems/invalid-credentials
                title: Invalid credentials
                status: 401
                code: INVALID_CREDENTIALS
                detail: Incorrect username or password. Please try again.
        '423':
          description: Locked after repeated failures. `Retry-After` says for how long.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/link:
    post:
      tags: [auth]
      operationId: linkCredentials
      summary: Attach a username and password to the signed-in guest account.
      description: |
        Keeps the player id, the level, the inventory and the leaderboard history the
        guest session already earned. This is an upgrade, not a fresh start - losing
        progress at this step is the reason players refuse to sign up at all.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Credentials attached. Existing tokens stay valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: This account is not a guest, or the username is taken.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Exchange a refresh token for a new pair.
      description: |
        Rotation: the presented refresh token is revoked and a new one issued, so a
        stolen token is usable at most once.

        **Reuse detection.** A refresh token presented twice means one of the two
        holders is an attacker, and the server cannot tell which. The whole token
        family is revoked and both are forced to sign in again - `401` with
        `REFRESH_TOKEN_REUSED`. The client treats that as a hard sign-out and must not
        retry.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair. The presented refresh token is now dead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Expired, revoked, or replayed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session a refresh token belongs to.
      description: |
        Takes the refresh token rather than reading the bearer, and needs no access
        token at all. **This differs from draft.1 of this contract**, which secured the
        endpoint with the bearer and passed no body - and so named no token to revoke.
        Implementing it surfaced the gap: the access token identifies the account, not
        which of that account's devices is signing out.

        Presenting a refresh token is itself proof of holding the session, so requiring
        the bearer as well would only mean a client whose access token had expired could
        not sign out without refreshing first.

        Revokes the whole token family, which is what a session is on one device. The
        player's other devices each have a family of their own and stay signed in.

        The access token is not revoked - it is a short-lived JWT and is allowed to
        expire on its own. Revoking it would mean a blocklist checked on every request,
        trading a stateless hot path for a few minutes of exposure that the short
        lifetime already bounds.

        Replaces `PlayerManager.Exit`, which set a field to null.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: |
            Signed out. Answered for an unknown or already-revoked token too: reporting
            the difference would make this a way to test whether a stolen string is
            still live, and there is nothing a caller could do with the distinction.
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/players/me:
    get:
      tags: [players]
      operationId: getMyPlayerState
      summary: The whole save for the signed-in player.
      description: |
        One call, everything the Home screen binds to. Returns an `ETag`; hold it and
        send it back as `If-Match` on any write.

        `stamina.current` is **computed at read time** from the stored value and the
        timestamp of the last change - it is not a number ticking down in a row
        somewhere. That is what makes changing the device clock useless, and it is why
        `PlayerData.GetMaxReason` has to live on the server too.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerState'
        '304':
          description: Unchanged since the `If-None-Match` value.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/players/me/squad:
    put:
      tags: [players]
      operationId: setSquad
      summary: Set the four squad slots.
      description: |
        Exactly four entries, `null` for an empty slot - the shape
        `PlayerData.GetSquad()` normalises to. The server rejects a character the
        player does not own, and the same character in two slots at once.

        One of only two writes in Phase 2: the squad is a preference, so the client may
        state it outright. Anything that grants or spends belongs to Phase 3.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquadRequest'
      responses:
        '200':
          description: Saved. Returns the whole state so the client never guesses.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/players/me/desktop-character:
    put:
      tags: [players]
      operationId: setDesktopCharacter
      summary: Set the character shown on the Home screen.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopCharacterRequest'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/shop/offers:
    get:
      tags: [shop]
      operationId: getShopOffers
      summary: What the shop is selling, and what it costs.
      description: |
        The catalogue and its prices come from the server. The client used to read
        both out of `ShopItemDataList.asset` and do the arithmetic itself, which meant
        the amount a player paid was a number their own device chose.

        Ordered and stable, so the shop does not reshuffle itself between visits. A
        price change is an UPDATE rather than a store release.
      responses:
        '200':
          description: The offers currently on sale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/shop/purchases:
    post:
      tags: [shop]
      operationId: purchase
      summary: Buy an offer.
      description: |
        The request names an offer and a quantity. It cannot name a price and it
        cannot name a resulting balance - both were the client's arithmetic before
        this existed.

        全有或全无 / The debit, the credit, the ledger row and the state version move
        together or not at all. A crash between the debit and the credit would
        otherwise take a player's currency and give them nothing.

        Returns the whole player, the way the Phase 2 writes do, so the client never
        has to work out what its inventory became.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '201':
          description: Bought.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such offer, or it is no longer on sale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            `INSUFFICIENT_FUNDS`, or `IDEMPOTENCY_KEY_CONFLICT`. 409 rather than 422
            for the balance: the request was well formed and the rule it broke is
            about state. Retrying it unchanged after earning more can succeed, which
            is what a conflict means.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs:
    post:
      tags: [runs]
      operationId: startRun
      summary: Open an attempt at a song.
      description: |
        Charges the stage's stamina and issues the run's seed.

        不是"扣理智" / Deliberately a lifecycle rather than a debit. The far end of
        this is a submitted result, and a result can only be trusted if the server
        already knows a run was opened, on which chart, what it cost, and with which
        random sequence. An endpoint that only spent stamina would have to be
        redesigned into this the moment scores arrive.

        The cost lives on the server. It had no home before: `DungeonMeta` declares a
        `reason` field but no DungeonMeta asset exists in the project, so
        SelectDungeonUI was spending a number that came from nowhere.

        选了谁要先说 / The operator is named here, before the song, and must be on the
        player's roster. Its modifiers are part of what the result is checked against;
        a result that could name its operator afterwards would name the strongest one.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '201':
          description: The run is open. Play.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown chart, or not in rotation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            `INSUFFICIENT_STAMINA`, `CHARACTER_NOT_OWNED`, or `STATE_CONFLICT` when two
            starts raced for the last of the bar.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{runId}/complete:
    post:
      tags: [runs]
      operationId: completeRun
      summary: Close a run and have its result reviewed.
      description: |
        Reviews the result, counts it towards the missions if it is a clear, and ranks it
        if it was accepted - committed together, so a run is never ranked without being
        closed nor counted without its result on record.

        三种结论 / The review answers one of three ways:

        - `Accepted` - consistent with the chart and the rules. A clear, and ranked.
        - `Flagged` - nothing impossible, but something statistical looks unlike a
          person (timing locked to the frame, input far beyond the notes). Still a clear;
          held off the leaderboards. The client is told only `UNDER_REVIEW`.
        - `Rejected` - impossible as submitted. Not ranked and NOT a clear: the missions
          do not move, since a forged clear is exactly what mission farming would send.
          The reasons are named, because they describe the client's own output.

        Malformed is not the same as dishonest: a missing result on a win or a negative
        count is a `422` and nothing is stored, while a well-formed result that cannot be
        true is stored and answered with a verdict.

        通关才算 / Only a clear advances the "clear any song" missions. The stamina is
        spent either way; it was spent when the run opened.

        The idempotency key the client uses is the run id itself: "this run ended" cannot
        honestly happen twice, so a retry replays the first answer.

        A run that belongs to someone else is answered exactly like one that does not
        exist. Telling them apart would let a stranger probe which run ids are real.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRunRequest'
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCompletion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `RUN_NOT_OPEN` - unknown, someone else's, or already closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The body is over 4 MiB. A real trace compresses to tens of kilobytes.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/leaderboards/{stageId}:
    get:
      tags: [leaderboards]
      operationId: getLeaderboard
      summary: A stage's board, top first, with the caller's own line.
      description: |
        Ties go to whoever set the score first: matching a score is not the same as having
        held it. `me` is the caller's entry and rank wherever it falls, page or not.
      parameters:
        - name: stageId
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
        - name: period
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LeaderboardPeriod'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`STAGE_NOT_FOUND` - unknown chart, or not in rotation.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/gacha/banners:
    get:
      tags: [gacha]
      operationId: getGachaBanners
      summary: The banners open now or opening later, with the rules the server rolls.
      description: |
        Ended banners are not listed. A banner whose rules cannot be kept - odds that do not
        add up to 10000, a tier with a chance and nobody in it - is withheld and logged
        rather than served and then failing every pull.

        `pullsSinceFiveStar` is the caller's own count on each banner.
      responses:
        '200':
          description: The banners, in display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaBannerList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/gacha/pulls:
    post:
      tags: [gacha]
      operationId: pull
      summary: Headhunt once or ten times.
      description: |
        The request names a banner and a count. It cannot name a price, an operator or a
        rarity.

        Paid in the banner's ticket (a Headhunting Permit) when the player holds enough for
        the whole request, otherwise in its currency - never a mix of the two.

        Each pull draws a tier from the odds, then an operator uniformly within it. After
        `pityThreshold` pulls in a row without a 5-star the next one is a 5-star; any 5-star
        resets the count, and each banner counts on its own. An operator the player already
        owns becomes its duplicate item instead.

        全有或全无 / The payment, the operators, the duplicates, the pity count, the history
        and the state version move together or not at all. Idempotent: a retry with the same
        key replays the first result instead of rolling again, so retrying is never a free
        reroll.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GachaPullRequest'
      responses:
        '201':
          description: Pulled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaPullResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`BANNER_NOT_FOUND` - unknown banner, or retired.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`BANNER_CLOSED` (not yet open, or ended), `INSUFFICIENT_FUNDS`, or `IDEMPOTENCY_KEY_CONFLICT`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/gacha/history:
    get:
      tags: [gacha]
      operationId: getGachaHistory
      summary: The caller's pulls, newest first, a page at a time.
      parameters:
        - name: before
          in: query
          required: false
          description: The `nextBefore` of the previous page. Omitted for the newest page.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaHistoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: The live remote config.
      security: []
      description: |
        Anonymous, so a build can learn it is out of date or that the game is in maintenance
        before it signs in. The version is the ETag; a client holding it gets 304.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The live config.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteConfig'
        '304':
          description: Unchanged since the version in If-None-Match.
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/admin/config:
    put:
      tags: [admin]
      operationId: updateConfig
      summary: Save a new version of the config.
      description: |
        Needs If-Match with the version the change was made from: two administrators editing at
        once cannot silently overwrite each other - the second is refused with 412.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdateRequest'
      responses:
        '201':
          description: Saved; live on the next request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN` - signed in, but not an administrator.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /v1/admin/config/rollback:
    post:
      tags: [admin]
      operationId: rollbackConfig
      summary: Put an earlier version back, as a new version.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigRollbackRequest'
      responses:
        '201':
          description: The old document is live again under a new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /v1/admin/config/history:
    get:
      tags: [admin]
      operationId: getConfigHistory
      summary: Every version, newest first, with who saved it and why.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/missions:
    get:
      tags: [missions]
      operationId: getMissionBoards
      summary: Both boards, with progress and what can be claimed.
      description: |
        重置是隐含的 / The reset is implicit rather than scheduled. A board's period key
        is part of the identity of every counter and claim, so a new day is a new key, a
        new key has no rows, and no row reads as zero. There is no job to wipe anything -
        and therefore no job that can fail to run.

        `resetsAt` is when the current board ends, in UTC. The boundary is 04:00 in the
        players' own timezone, which is arithmetic that has no business being on a device
        whose clock is attacker-controlled.
      responses:
        '200':
          description: Both boards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionBoards'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/missions/claims:
    post:
      tags: [missions]
      operationId: claimMission
      summary: Take a finished mission's points.
      description: |
        Pays points, not items. `granted` is empty.

        存在即已领 / Claiming twice is refused by a primary key on
        (account, tab, mission, period) rather than by a check that could race.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimMissionRequest'
      responses:
        '200':
          description: Claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`MISSION_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            `MISSION_NOT_COMPLETE`, or `ALREADY_CLAIMED`. The second is not the player's
            mistake - two taps on a slow connection land there - so a client should
            refresh the board rather than say anything alarming.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/missions/reward-claims:
    post:
      tags: [missions]
      operationId: claimMissionReward
      summary: Take a reward the claimed points have unlocked.
      description: |
        The claim row and the items move together - a crash between them would either
        pay twice or pay nothing.

        Thresholds count points that have been CLAIMED, not merely earned.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRewardRequest'
      responses:
        '200':
          description: Claimed, and the items are in the bag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`MISSION_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`NOT_ENOUGH_POINTS`, or `ALREADY_CLAIMED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived access token from any `/v1/auth/*` sign-in. Carries the player id
        and nothing the client is trusted to assert - no level, no balances. Anything
        the server needs in order to decide is read server-side, or it is not a
        decision the server is actually making.

  parameters:
    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: |
        The game build sending the request, "major.minor.patch". Older than the config's
        `minClientVersion` is refused with 426 `CLIENT_OUTDATED` on every endpoint but
        `/v1/config`, health and admin. Absent: not checked.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: |
        Client-generated UUID, stable across retries of the *same* logical request and
        different for a new one. The server stores it against the response for 24 hours
        and replays that response rather than acting twice.

        The same key with a *different* body answers 409 with code
        IDEMPOTENCY_KEY_CONFLICT - that is not a retry, and replying with the first
        response would answer a question that was not asked. A missing key answers 400.

        The guarantee is a unique index on (key, endpoint), not a lookup: two
        concurrent retries both read nothing and both proceed, and the database is what
        refuses the second write.

    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: |
        The `ETag` from the last `GET /v1/players/me`. A mismatch is `412`; absent is
        `428`. Required rather than optional on purpose - an optional precondition is
        one the client forgets, and the bug surfaces as a player losing progress on
        their second device.

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: Answer `304` if the state still matches this ETag.

  headers:
    ETag:
      schema:
        type: string
      description: Opaque version of the player state. Send back as `If-Match`.
    RetryAfter:
      schema:
        type: integer
      description: Seconds to wait before retrying.

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unauthorized:
      description: Missing, expired or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ValidationFailed:
      description: Well-formed but semantically wrong. `errors` names the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.promuse.example/problems/validation-failed
            title: Validation failed
            status: 422
            code: VALIDATION_FAILED
            errors:
              squad:
                - AMIYA appears in slot 0 and slot 2.

    PreconditionFailed:
      description: |
        The state changed since the ETag was issued - another device wrote first. The
        client re-reads and shows the conflict; it does not merge silently.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    PreconditionRequired:
      description: The write needs an `If-Match` and did not carry one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ServiceUnavailable:
      description: |
        `MAINTENANCE` (the game is closed; `detail` is the operator's message and Retry-After is
        set when an end time is known) or `FEATURE_DISABLED` (the feature behind this endpoint is
        switched off by remote config).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ClientOutdated:
      description: '`CLIENT_OUTDATED` - this build is older than the minimum the config accepts.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalError:
      description: |
        Unexpected server fault. `traceId` correlates with the server log; nothing
        about the internals is ever exposed in `detail`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: |
            Stable machine-readable discriminator. The client switches on this, never
            on `title` or `detail`, which are free to be reworded or localised.
          examples: [USERNAME_TAKEN, INVALID_CREDENTIALS, STATE_CONFLICT]
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        traceId:
          type: string

    GuestSignInRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            Stable per install. Identifies the device, and is **not** a credential - it
            is guessable, so it grants a guest session and nothing an account holds.

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
          pattern: '^[A-Za-z0-9_]+$'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: |
            Sent over TLS, hashed with Argon2id on arrival, never stored in the clear,
            never logged, never echoed back in any response.
        deviceId:
          type: string
          description: Optional. Links this device to the new account at creation.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenPair:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds. Short by design - revocation leans on this.
          examples: [900]
        refreshToken:
          type: string
        refreshExpiresIn:
          type: integer
          examples: [2592000]

    AuthSession:
      type: object
      required: [playerId, isGuest, tokens, serverTime]
      properties:
        playerId:
          type: string
          format: uuid
        isGuest:
          type: boolean
          description: True until `/v1/auth/link` attaches credentials.
        tokens:
          $ref: '#/components/schemas/TokenPair'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    ServerTime:
      type: string
      format: date-time
      description: |
        Authoritative clock. Every deadline the game enforces is derived from this, so
        that changing the device clock changes nothing.

    PlayerState:
      type: object
      required:
        - playerId
        - displayName
        - level
        - exp
        - expToNextLevel
        - stamina
        - characters
        - squad
        - inventory
        - stateVersion
        - serverTime
      properties:
        playerId:
          type: string
          format: uuid
        displayName:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 120
          description: Cap matches `PlayerData.GetMaxLevel()`.
        exp:
          type: integer
          minimum: 0
        expToNextLevel:
          type: integer
          description: |
            From `PlayerData.GetMaxExp(level)`. Computed server-side and sent, rather
            than recomputed by the client, so retuning the curve needs no app update
            and the two can never disagree.
        stamina:
          $ref: '#/components/schemas/Stamina'
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterState'
        squad:
          $ref: '#/components/schemas/Squad'
        desktopCharacterId:
          type: [string, 'null']
        inventory:
          type: array
          items:
            $ref: '#/components/schemas/ItemStack'
        stateVersion:
          type: integer
          description: |
            Increments on every accepted write. The same value the `ETag` encodes,
            surfaced in the body so a conflict can be explained to the player rather
            than only handled by the transport.
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    Stamina:
      type: object
      description: |
        `PlayerData.reason` (理智). Regenerates with wall-clock time, so the server owns
        it outright.
      required: [current, max]
      properties:
        current:
          type: integer
          minimum: 0
        max:
          type: integer
          description: From `PlayerData.GetMaxReason(level)`.
        nextPointAt:
          type: [string, 'null']
          format: date-time
          description: When the next point lands. Null at full.
        fullAt:
          type: [string, 'null']
          format: date-time

    CharacterState:
      type: object
      description: Mirrors `Data.Char.CharData`.
      required: [characterId, elite, level, exp, trust]
      properties:
        characterId:
          type: string
          examples: [AMIYA, NOVA, ECHO, PULSE]
          description: |
            Matches the ids under `Resources/Meta/Char`. Only the player's progression
            lives here - artwork, rarity and stats stay client-side content, so a
            balance change is a content update and not a database migration.
        elite:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
        exp:
          type: integer
          minimum: 0
        trust:
          type: integer
          minimum: 0

    Squad:
      type: array
      minItems: 4
      maxItems: 4
      description: |
        Always four entries, `null` for empty - the shape `PlayerData.GetSquad()`
        normalises to. Fixed length rather than a list of filled slots, because the
        slot position is meaningful.
      items:
        type: [string, 'null']

    ItemStack:
      type: object
      description: Mirrors `Data.Item.ItemStack`.
      required: [itemId, amount]
      properties:
        itemId:
          type: integer
          description: Ids from `Resources/Meta/Item` - 1 Orundum, 2 LMD, 6 Orirock.
        amount:
          type: integer
          minimum: 1

    SquadRequest:
      type: object
      required: [squad]
      properties:
        squad:
          $ref: '#/components/schemas/Squad'

    DesktopCharacterRequest:
      type: object
      required: [characterId]
      properties:
        characterId:
          type: [string, 'null']
          description: Null clears it. Must be a character the player owns.

    ShopOffer:
      type: object
      required: [offerId, sellItemId, sellAmount, priceItemId, priceAmount]
      properties:
        offerId:
          type: string
          format: uuid
        sellItemId:
          type: integer
          description: What the player receives. An id from Resources/Meta/Item.
        sellAmount:
          type: integer
          minimum: 1
        priceItemId:
          type: integer
          description: What they pay with - 6 (Orirock), or 8 (Purchase Certificate) for the offers that spend duplicate headhunting results.
        priceAmount:
          type: integer
          minimum: 1

    ShopCatalog:
      type: object
      required: [offers, serverTime]
      properties:
        offers:
          type: array
          items:
            $ref: '#/components/schemas/ShopOffer'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    PurchaseRequest:
      type: object
      required: [offerId, quantity]
      properties:
        offerId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: |
            How many of the offer, in one checkout. The cap matches the client's own.
            No total price is sent: a total the client computed is a total the client
            can choose.

    PurchaseResult:
      type: object
      required: [purchaseId, granted, charged, player]
      properties:
        purchaseId:
          type: string
          format: uuid
          description: The ledger row, so a player can be told where their currency went.
        granted:
          $ref: '#/components/schemas/ItemStack'
        charged:
          $ref: '#/components/schemas/ItemStack'
        player:
          $ref: '#/components/schemas/PlayerState'

    StartRunRequest:
      type: object
      required: [stageId, characterId]
      properties:
        stageId:
          type: string
          maxLength: 64
          description: The chart being attempted, from `SongChart.stageId`.
        characterId:
          type: string
          maxLength: 32
          description: The operator, which must be on the player's roster.

    RunTicket:
      type: object
      required: [runId, stageId, seed, staminaSpent, player, serverTime]
      properties:
        runId:
          type: string
          format: uuid
        stageId:
          type: string
        seed:
          type: integer
          format: int64
          description: |
            服务端发, 从不接收 / Issued by the server and never accepted from the
            client. JudgeUpgradePassive rolls per judgement, so the scoring rules are
            not deterministic and the server cannot re-simulate a run without knowing
            the sequence. If the client chose this number it would simply re-roll until
            the draw was favourable.

            The client seeds the run's own generator (`RunState.NextRoll`, SplitMix64)
            from this - never UnityEngine.Random, which the rest of the scene also
            draws from.
        staminaSpent:
          type: integer
          minimum: 0
        player:
          $ref: '#/components/schemas/PlayerState'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    MissionTab:
      type: string
      enum: [Daily, Weekly]
      description: |
        枚举用名字 / Serialised as the name, not an ordinal. An ordinal silently remaps
        every stored and in-flight value when someone reorders the enum, and these names
        are also written into the period keys held per player.

    MissionGoal:
      type: string
      enum: [PlaySong, BuyShopItem]
      description: |
        What a mission counts. A closed set on purpose: each value needs a server-side
        place that advances it, and a goal nothing advances is a mission nobody can
        finish. `PlaySong` advances on a WON run completion; `BuyShopItem` on a checkout,
        once per checkout rather than once per unit.

    MissionState:
      type: object
      required: [missionId, description, goal, target, progress, points, isComplete, isClaimed]
      properties:
        missionId:
          type: string
        description:
          type: string
        goal:
          $ref: '#/components/schemas/MissionGoal'
        target:
          type: integer
          minimum: 1
        progress:
          type: integer
          description: Capped at the target, so a bar never overfills.
        points:
          type: integer
          description: What claiming this mission pays into the board total.
        isComplete:
          type: boolean
        isClaimed:
          type: boolean
          description: |
            做完和领了是两回事 / Finished and claimed are different states. An unclaimed
            mission is worth no points yet, which is the whole point of the manual step.

    RewardState:
      type: object
      required: [rewardId, requiredPoints, itemId, amount, isClaimed, isClaimable]
      properties:
        rewardId:
          type: string
        requiredPoints:
          type: integer
          description: Points that must have been CLAIMED, not merely earned.
        itemId:
          type: integer
        amount:
          type: integer
          minimum: 1
        isClaimed:
          type: boolean
        isClaimable:
          type: boolean
          description: Computed server-side, so the client never re-derives the rule.

    MissionBoard:
      type: object
      required: [tab, title, points, resetsAt, missions, rewards]
      properties:
        tab:
          $ref: '#/components/schemas/MissionTab'
        title:
          type: string
        points:
          type: integer
        resetsAt:
          type: string
          format: date-time
          description: |
            When this board empties, in UTC. The boundary is 04:00 in the players' own
            timezone; the client counts down from this rather than working that out on a
            clock the player controls.
        missions:
          type: array
          items:
            $ref: '#/components/schemas/MissionState'
        rewards:
          type: array
          items:
            $ref: '#/components/schemas/RewardState'

    MissionBoards:
      type: object
      required: [daily, weekly, serverTime]
      properties:
        daily:
          $ref: '#/components/schemas/MissionBoard'
        weekly:
          $ref: '#/components/schemas/MissionBoard'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    ClaimMissionRequest:
      type: object
      required: [tab, missionId]
      properties:
        tab:
          $ref: '#/components/schemas/MissionTab'
        missionId:
          type: string

    ClaimRewardRequest:
      type: object
      required: [tab, rewardId]
      properties:
        tab:
          $ref: '#/components/schemas/MissionTab'
        rewardId:
          type: string

    ClaimResult:
      type: object
      required: [granted, boards, player]
      properties:
        granted:
          type: array
          description: Empty for a mission claim, which pays points rather than items.
          items:
            $ref: '#/components/schemas/ItemStack'
        boards:
          $ref: '#/components/schemas/MissionBoards'
        player:
          $ref: '#/components/schemas/PlayerState'

    CompleteRunRequest:
      type: object
      required: [won]
      properties:
        won:
          type: boolean
          description: |
            通关才算 / Only a win advances the "clear any song" missions, matching what
            GameManager already did: a run that ran out of HP is not a clear.
        result:
          oneOf:
            - $ref: '#/components/schemas/RunResult'
            - type: 'null'
          description: Required when `won` is true. Optional for a failed run.

    RunResult:
      type: object
      required: [score, maxCombo, perfect, great, hit, miss, fullCombo, rulesetFingerprint, trace]
      description: |
        What the device says happened, and the raw input it happened from. Counts are
        named after the Judgement enum; the results screen's "good" and "normal" are older
        labels for Great and Hit.
      properties:
        score:
          type: integer
          minimum: 0
        maxCombo:
          type: integer
          minimum: 0
        perfect:
          type: integer
          minimum: 0
        great:
          type: integer
          minimum: 0
        hit:
          type: integer
          minimum: 0
        miss:
          type: integer
          minimum: 0
        fullCombo:
          type: boolean
        rulesetFingerprint:
          type: string
          maxLength: 32
          description: |
            `RulesetFingerprint.Compute` over the rules the run was played with: a 64-bit
            FNV-1a of every scoring number, floats hashed by their IEEE bits. A mismatch is
            the device and the server disagreeing about the rules, and is answered as
            `RULESET_MISMATCH` rather than as an impossible score.
        trace:
          type: string
          maxLength: 2097152
          description: |
            The input trace, gzipped then base64. One record per gameplay frame: the song
            time the frame was judged at, the lanes pressed and the lanes held. Kept by the
            server so the run can be replayed against its seed.

    ScoreVerdict:
      type: string
      enum: [Accepted, Flagged, Rejected]

    ScoreReview:
      type: object
      required: [verdict, reasons, score, isPersonalBest]
      properties:
        verdict:
          $ref: '#/components/schemas/ScoreVerdict'
        reasons:
          type: array
          description: |
            Empty when accepted. When rejected, any of `RULESET_MISMATCH`, `TRACE_MISSING`,
            `TRACE_INVALID`, `TRACE_INCOMPLETE`, `COUNTS_INCONSISTENT`, `COMBO_INCONSISTENT`,
            `FULL_COMBO_INCONSISTENT`, `SCORE_ABOVE_CEILING`, `FINISHED_TOO_FAST`,
            `NOT_ENOUGH_INPUT`. When flagged, `UNDER_REVIEW` alone - which signal fired
            stays on the server.
          items:
            type: string
        score:
          type: integer
        isPersonalBest:
          type: boolean
          description: This run is now the player's all-time entry on the stage.
        allTimeRank:
          type: [integer, 'null']
          minimum: 1
        weeklyRank:
          type: [integer, 'null']
          minimum: 1

    RunCompletion:
      type: object
      required: [runId, won, boards, player, serverTime]
      properties:
        runId:
          type: string
          format: uuid
        won:
          type: boolean
          description: Whether the server counted a clear - the claim, unless rejected.
        review:
          oneOf:
            - $ref: '#/components/schemas/ScoreReview'
            - type: 'null'
          description: Null when no result was sent, which only a failed run may do.
        boards:
          $ref: '#/components/schemas/MissionBoards'
        player:
          $ref: '#/components/schemas/PlayerState'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    LeaderboardPeriod:
      type: string
      enum: [AllTime, Weekly]
      default: AllTime

    LeaderboardEntry:
      type: object
      required: [rank, playerId, displayName, score, maxCombo, achievedAt]
      properties:
        rank:
          type: integer
          minimum: 1
        playerId:
          type: string
          format: uuid
        displayName:
          type: string
        score:
          type: integer
        maxCombo:
          type: integer
        characterId:
          type: [string, 'null']
          description: The operator the score was set with.
        achievedAt:
          type: string
          format: date-time

    LeaderboardPage:
      type: object
      required: [stageId, period, periodKey, entries, serverTime]
      properties:
        stageId:
          type: string
        period:
          $ref: '#/components/schemas/LeaderboardPeriod'
        periodKey:
          type: string
          description: '"all", or the ISO week such as "2026-W41".'
        resetsAt:
          type: [string, 'null']
          format: date-time
          description: When the weekly board moves to a new key. Null for all-time.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        me:
          oneOf:
            - $ref: '#/components/schemas/LeaderboardEntry'
            - type: 'null'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    GachaPoolEntry:
      type: object
      required: [characterId, rarity, duplicateItemId, duplicateAmount]
      properties:
        characterId:
          type: string
        rarity:
          type: integer
          minimum: 3
          maximum: 5
          description: The server's rarity - the tier this operator is drawn under.
        duplicateItemId:
          type: integer
          description: What a copy the player already owns becomes. Purchase Certificate (8) today.
        duplicateAmount:
          type: integer
          minimum: 1

    GachaBannerInfo:
      type: object
      required: [bannerId, rateFiveStar, rateFourStar, rateThreeStar, pityThreshold, currencyItemId,
                 costSingle, costMulti, pool, pullsSinceFiveStar]
      properties:
        bannerId:
          type: string
          description: Stable; the client matches its art to it and pity is keyed by it.
        startsAt:
          type: [string, 'null']
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time
          description: Null for a permanent banner.
        rateFiveStar:
          type: integer
          description: Basis points - 200 is 2.00%. The three rates add up to exactly 10000.
        rateFourStar:
          type: integer
        rateThreeStar:
          type: integer
        pityThreshold:
          type: integer
          minimum: 1
        currencyItemId:
          type: integer
        costSingle:
          type: integer
          minimum: 1
        costMulti:
          type: integer
          minimum: 1
        ticketItemId:
          type: [integer, 'null']
          description: Spent first, one per pull, when the player holds enough for the whole request.
        pool:
          type: array
          description: Rarest first.
          items:
            $ref: '#/components/schemas/GachaPoolEntry'
        pullsSinceFiveStar:
          type: integer
          minimum: 0

    GachaBannerList:
      type: object
      required: [banners, serverTime]
      properties:
        banners:
          type: array
          items:
            $ref: '#/components/schemas/GachaBannerInfo'
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    GachaPullRequest:
      type: object
      required: [bannerId, times]
      properties:
        bannerId:
          type: string
        times:
          type: integer
          enum: [1, 10]

    GachaPullOutcome:
      type: object
      required: [characterId, rarity, isNew, guaranteed]
      properties:
        characterId:
          type: string
        rarity:
          type: integer
        isNew:
          type: boolean
          description: The player did not own this operator before.
        converted:
          oneOf:
            - $ref: '#/components/schemas/ItemStack'
            - type: 'null'
          description: What the copy became; null when it was new.
        guaranteed:
          type: boolean
          description: Given by the pity count rather than the odds.

    GachaPullResult:
      type: object
      required: [batchId, bannerId, pulls, charged, pullsSinceFiveStar, player]
      properties:
        batchId:
          type: string
          format: uuid
        bannerId:
          type: string
        pulls:
          type: array
          items:
            $ref: '#/components/schemas/GachaPullOutcome'
        charged:
          $ref: '#/components/schemas/ItemStack'
        pullsSinceFiveStar:
          type: integer
        player:
          $ref: '#/components/schemas/PlayerState'

    GachaHistoryEntry:
      type: object
      required: [sequence, batchId, bannerId, characterId, rarity, isNew, pulledAt]
      properties:
        sequence:
          type: integer
          format: int64
        batchId:
          type: string
          format: uuid
        bannerId:
          type: string
        characterId:
          type: string
        rarity:
          type: integer
        isNew:
          type: boolean
        pulledAt:
          type: string
          format: date-time

    GachaHistoryPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/GachaHistoryEntry'
        nextBefore:
          type: [integer, 'null']
          format: int64
          description: Pass as `before` for the next page; null on the last one.

    MaintenanceWindow:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        message:
          type: [string, 'null']
          maxLength: 300
          description: Shown to players while it is on.
        endsAt:
          type: [string, 'null']
          format: date-time
          description: The expected end, shown and sent as Retry-After.

    FeatureFlags:
      type: object
      required: [gacha, shop, ranked, leaderboards]
      description: Each one is enforced by the server on the endpoint behind it.
      properties:
        gacha:
          type: boolean
          description: POST /v1/gacha/pulls.
        shop:
          type: boolean
          description: POST /v1/shop/purchases.
        ranked:
          type: boolean
          description: POST /v1/runs. Completing a run already open is never refused.
        leaderboards:
          type: boolean
          description: GET /v1/leaderboards/{stageId}. Scores are still recorded while off.

    ConfigDocument:
      type: object
      required: [maintenance, minClientVersion, features]
      properties:
        maintenance:
          $ref: '#/components/schemas/MaintenanceWindow'
        minClientVersion:
          type: string
          examples: ['1.0.0']
        features:
          $ref: '#/components/schemas/FeatureFlags'
        announcement:
          type: [string, 'null']
          maxLength: 300
          description: Shown once per version on the Home screen.

    RemoteConfig:
      type: object
      required: [version, document, updatedAt, serverTime]
      properties:
        version:
          type: integer
          description: Also the ETag.
        document:
          $ref: '#/components/schemas/ConfigDocument'
        updatedAt:
          type: string
          format: date-time
        serverTime:
          $ref: '#/components/schemas/ServerTime'

    ConfigUpdateRequest:
      type: object
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/ConfigDocument'
        note:
          type: [string, 'null']
          maxLength: 200

    ConfigRollbackRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
        note:
          type: [string, 'null']
          maxLength: 200

    ConfigRevision:
      type: object
      required: [version, document, createdAt]
      properties:
        version:
          type: integer
        document:
          $ref: '#/components/schemas/ConfigDocument'
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: [string, 'null']
          description: The administrator's username; null for the seeded first version.
        note:
          type: [string, 'null']
        rolledBackFrom:
          type: [integer, 'null']

    ConfigHistory:
      type: object
      required: [revisions]
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/ConfigRevision'
