openapi: 3.1.0

info:
  title: Promuse Backend API
  version: 1.0.0-draft.19
  summary: Authentication and player state for the Promuse mobile rhythm game.
  description: |
    **Phase 1** authentication, **Phase 2** player state, **Phase 3** the economy -
    shop, runs and missions, **Phase 4** scored results and leaderboards, then headhunting
    (gacha) with the server rolling the dice, remote config and live events. Each written
    before its implementation, so the client and the server are built against one
    agreement rather than the client being written against whatever the server happened
    to return.

    Every economy operation is server-authoritative and has its own endpoint rather
    than riding along on a player-state write. The client names what it wants; it never
    names a price, a balance, or a resulting inventory. The only writes that state a
    value outright are the two fields the client legitimately owns: the squad and the
    desktop character.

    Still absent: gacha, and replaying a run. A result is reviewed today against hard
    limits from the chart and the rules - counts, combo, a score ceiling, timing - and
    its raw input trace is kept, so the replay can be added to the same review without
    changing what the client sends.

    ## Where the data comes from

    The shapes below mirror `Assets/Arknights/Data/Player/PlayerData.cs`, which is what
    the game holds today as a ScriptableObject that nothing ever writes back. Field
    names are anglicised where the original is Chinese: `reason` (理智) is `stamina`
    here, because "reason" reads as a cause rather than a resource in English.

    ## Conventions that apply to every operation

    - **Versioning.** The major version is in the path (`/v1/...`). A breaking change
      opens `/v2` and both run side by side; a mobile client that has not updated must
      keep working, because a store rollout is neither instant nor reversible
      per-device.
    - **Errors** are RFC 9457 Problem Details (`application/problem+json`), never a
      bare string. `code` is the machine-readable discriminator the client switches on;
      `title` and `detail` are for humans and may be reworded without a version bump.
    - **Idempotency.** Every unsafe operation that creates or consumes something takes
      an `Idempotency-Key`. A mobile client on a train loses its response, not its
      request: without this, a retried sign-up creates a second account. The server
      stores the key with the response for 24 hours and replays it verbatim.
    - **Optimistic concurrency.** `GET /v1/players/me` returns an `ETag`; writes take
      `If-Match` and answer `412` when the state moved underneath. This is what stops
      two devices silently overwriting one another, and it is why `stateVersion` is in
      the body as well - the client shows the conflict, it does not resolve it alone.
    - **Time.** Every response carries `serverTime`, and every deadline the game
      enforces (stamina regeneration, daily reset) is computed from it. The device
      clock is attacker-controlled and is never an input.
    - **Rate limits** answer `429` with `Retry-After`. The client honours it rather
      than retrying on a schedule of its own.

tags:
  - name: auth
    description: |
      Sign-in, token rotation and account linking. Phase 1.

      The game opens straight into play with a guest session; credentials are attached
      later through `/v1/auth/link`. A rhythm game that demands a sign-up before the
      first note loses players at the only screen they have not yet enjoyed.
  - name: players
    description: Player state - the save that `PlayerData` never had. Phase 2.
  - name: characters
    description: |
      Operators: levelling with battle records and LMD, and promotion to the next elite
      phase. An operator's rhythm stats grow with its level, so the level is a number
      only the server sets.
  - name: shop
    description: |
      The economy, with the server holding the prices. Phase 3.
  - name: runs
    description: |
      One attempt at a song. Opened by `POST /v1/runs` with the operator fixed, closed by
      `POST /v1/runs/{runId}/complete` with the result and the input trace - one call for
      "it ended", so a run cannot be counted by one request and scored by another.
  - name: leaderboards
    description: |
      Each stage's best scores, all-time and this week. Phase 4.

      Written only by a run's completion, and only once its result was accepted. The
      weekly board is keyed by ISO week on the same Monday 04:00 boundary as the weekly
      missions, so it empties itself without a job.
  - name: gacha
    description: |
      Headhunting, with the server holding the odds, the pity counts and the dice.

      The client's banner asset keeps only presentation - title, text, which operator to
      draw large. The odds, the guarantee, the price, the schedule and the pool are served
      from here, so the Details screen can only ever print what the server actually rolls.
  - name: config
    description: |
      Remote config: maintenance, the minimum client version, feature flags and an announcement.

      Read anonymously by every client, before sign-in. Every switch is enforced by the server:
      maintenance answers 503 `MAINTENANCE` on every game endpoint (administrators pass), a
      request whose `X-Client-Version` is older than the minimum answers 426 `CLIENT_OUTDATED`,
      and a switched-off feature answers 503 `FEATURE_DISABLED` on the endpoint behind it.
  - name: admin
    description: |
      Changing remote config. Administrator accounts only - the flag is on the account and read
      on every request, never carried in the token. Every save is a new version; nothing is
      edited in place, so the history is the audit log and a rollback is a new version too.
  - name: events
    description: |
      Live events, built from optional modules: check-in days, missions with milestones, an
      event currency with its own shop, event stages that pay the currency, and a headhunting
      banner to point at. An event with only check-in days is a check-in event; one with all of
      them is a festival. Missions count only while the event is open, and every action that
      hands something out is idempotent and transactional.
  - name: stories
    description: |
      Corrections to story lines. The stories ship inside the game; the server holds only the
      fixes an administrator made after release, each applied by the game only while its own
      line still reads what the fix was written against.
  - name: campaign
    description: |
      The main campaign: chapters of stages played in order. A stage's first clear pays Orundum
      once; every clear rolls its drops on the server. Every cleared ranked run also pays player
      EXP (Sanity x the config's expPerSanity), and each level reached pays level/5 Originite Prime
      and refills Sanity.
  - name: mail
    description: |
      The mailbox. An administrator sends to one player or to every player who exists then;
      opening a mail reads it and collects its attachments in one step, exactly once.
  - name: notices
    description: |
      The announcement board - Event, System and News - with banners uploaded to this server.
  - name: sign-in
    description: |
      The monthly sign-in: one square per server day, in order, starting over each month. A month
      with no table of its own uses the default.
  - name: missions
    description: |
      The two mission boards. Phase 3.

      三步, 一步都不自动 / Three steps and only the first happens on its own: a counter
      moves when the player does something, a finished mission pays its points when it
      is claimed, and points hand over items when a reward is claimed. Opening the
      board grants nothing.

servers:
  - url: http://localhost:8080
    description: Local development.
  - url: https://staging.api.promuse.example
    description: Staging.
  - url: https://api.promuse.example
    description: Production.

security:
  - bearerAuth: []

paths:
  /v1/auth/guest:
    post:
      tags: [auth]
      operationId: signInAsGuest
      summary: Open a session for a device with no account yet.
      description: |
        The first call for a given `deviceId` creates a player; later calls return the
        same one. Idempotent by `deviceId` as well as by `Idempotency-Key`, because a
        reinstall replays this with a fresh key against the same device.

        A guest session is a real session: it can play, save and appear on a
        leaderboard. What it cannot do is survive losing the device, which is what
        `/v1/auth/link` is for.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSignInRequest'
      responses:
        '200':
          description: Known device, session reopened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '201':
          description: New player created for this device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account with a username and password.
      description: |
        Replaces `PlayerManager.Register`, which held new accounts in a `List` in
        memory and lost them when the app closed.

        The password is hashed with Argon2id server-side and is never stored, logged or
        returned. `409` when the username is taken - the case
        `PlayerManager.Register` threw an exception for.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          description: That username is already taken.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.promuse.example/problems/username-taken
                title: Username already taken
                status: 409
                code: USERNAME_TAKEN
                detail: That username is already taken.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with a username and password.
      description: |
        Replaces the plaintext comparison in `PlayerManager.Login`, which read two
        seeded `ScriptableObject`s out of `Resources/Data/User`.

        A wrong username and a wrong password return the identical `401` and the
        identical `code`. Distinguishing them tells an attacker which usernames exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Wrong username or password - deliberately indistinguishable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.promuse.example/problems/invalid-credentials
                title: Invalid credentials
                status: 401
                code: INVALID_CREDENTIALS
                detail: Incorrect username or password. Please try again.
        '423':
          description: Locked after repeated failures. `Retry-After` says for how long.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/link:
    post:
      tags: [auth]
      operationId: linkCredentials
      summary: Attach a username and password to the signed-in guest account.
      description: |
        Keeps the player id, the level, the inventory and the leaderboard history the
        guest session already earned. This is an upgrade, not a fresh start - losing
        progress at this step is the reason players refuse to sign up at all.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Credentials attached. Existing tokens stay valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: This account is not a guest, or the username is taken.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Exchange a refresh token for a new pair.
      description: |
        Rotation: the presented refresh token is revoked and a new one issued, so a
        stolen token is usable at most once.

        **Reuse detection.** A refresh token presented twice means one of the two
        holders is an attacker, and the server cannot tell which. The whole token
        family is revoked and both are forced to sign in again - `401` with
        `REFRESH_TOKEN_REUSED`. The client treats that as a hard sign-out and must not
        retry.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair. The presented refresh token is now dead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Expired, revoked, or replayed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session a refresh token belongs to.
      description: |
        Takes the refresh token rather than reading the bearer, and needs no access
        token at all. **This differs from draft.1 of this contract**, which secured the
        endpoint with the bearer and passed no body - and so named no token to revoke.
        Implementing it surfaced the gap: the access token identifies the account, not
        which of that account's devices is signing out.

        Presenting a refresh token is itself proof of holding the session, so requiring
        the bearer as well would only mean a client whose access token had expired could
        not sign out without refreshing first.

        Revokes the whole token family, which is what a session is on one device. The
        player's other devices each have a family of their own and stay signed in.

        The access token is not revoked - it is a short-lived JWT and is allowed to
        expire on its own. Revoking it would mean a blocklist checked on every request,
        trading a stateless hot path for a few minutes of exposure that the short
        lifetime already bounds.

        Replaces `PlayerManager.Exit`, which set a field to null.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: |
            Signed out. Answered for an unknown or already-revoked token too: reporting
            the difference would make this a way to test whether a stolen string is
            still live, and there is nothing a caller could do with the distinction.
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/players/me:
    get:
      tags: [players]
      operationId: getMyPlayerState
      summary: The whole save for the signed-in player.
      description: |
        One call, everything the Home screen binds to. Returns an `ETag`; hold it and
        send it back as `If-Match` on any write.

        `stamina.current` is **computed at read time** from the stored value and the
        timestamp of the last change - it is not a number ticking down in a row
        somewhere. That is what makes changing the device clock useless, and it is why
        `PlayerData.GetMaxReason` has to live on the server too.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerState'
        '304':
          description: Unchanged since the `If-None-Match` value.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/players/me/squad:
    put:
      tags: [players]
      operationId: setSquad
      summary: Set the four squad slots.
      description: |
        Exactly four entries, `null` for an empty slot - the shape
        `PlayerData.GetSquad()` normalises to. The server rejects a character the
        player does not own, and the same character in two slots at once.

        One of only three writes on the save, with the desktop character and the
        profile signature: the squad is a preference, so the client may state it outright. Anything that grants or spends belongs to Phase 3.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquadRequest'
      responses:
        '200':
          description: Saved. Returns the whole state so the client never guesses.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/players/me/desktop-character:
    put:
      tags: [players]
      operationId: setDesktopCharacter
      summary: Choose the assistant - the operator shown on Home and on the profile card.
      description: |
        Must be an operator the player owns; null clears the choice, and AMIYA stands
        there again.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopCharacterRequest'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/players/me/signature:
    put:
      tags: [players]
      operationId: setSignature
      summary: Write, or clear, the line on the player's profile card.
      description: |
        Everyone who opens the card reads it, so the server keeps it fit to show: one
        line, every kind of white space as a single space, control and format characters
        (a right-to-left override, a zero-width space) dropped. At most 60 characters as
        a reader counts them - an accented letter or an emoji is one. Too long is
        refused, never cut. Null or blank clears it.

        The answer carries what was kept, in `signature`. The game composes the text to
        NFC before sending; the server does not, as it runs with invariant globalization.

        While a moderator has locked the line (`signatureLockedUntil` in the player state)
        every write is refused with `SIGNATURE_LOCKED`, clearing included.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequest'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `SIGNATURE_LOCKED` - a moderator has locked the line. The detail says until
            when.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/players/{playerId}/signature/report:
    post:
      tags: [players]
      operationId: reportSignature
      summary: Report the line on someone else's profile card to the moderators.
      description: |
        A player reports a line once: while their report is open, and after a moderator
        has closed it, the same line cannot be reported by them again - a changed one can.
        At most 10 reports in any 24 hours. Not your own card, and not a card with no line.
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureReportRequest'
      responses:
        '204':
          description: Reported.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`PLAYER_NOT_FOUND` - no player has that id, or the account is banned.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`ALREADY_REPORTED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: '`REPORT_LIMIT_REACHED` - 10 reports in the last 24 hours.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/players/me/profile:
    get:
      tags: [players]
      operationId: getMyProfile
      summary: The signed-in player's own profile card.
      description: |
        The same card `GET /v1/players/{playerId}/profile` answers for anyone, with
        `isSelf` true - the one the Home screen's profile button opens.
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/players/{playerId}/profile:
    get:
      tags: [players]
      operationId: getProfile
      summary: Any player's profile card, by the id a leaderboard row carries.
      description: |
        Read-only and public to every signed-in player: the name and tag, level, the
        day the account was made, the operator on the card, how far through the
        campaign, how many operators, and the rhythm record. Nothing private - no bag,
        no stamina.

        Counted at read time and sent without an `ETag`: the counts move with every
        run the owner finishes.
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            `PLAYER_NOT_FOUND` - no player has that id, or the account is banned. A
            banned player's own card still opens for them.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/characters/{characterId}/level-up:
    post:
      tags: [characters]
      operationId: levelUpCharacter
      summary: Spend battle records and LMD to raise an operator's level.
      description: |
        The request names the records to spend, never the level wanted: the server adds
        up their EXP (Basic 200, Frontline 400, Tactical 1000, Strategic 2000) and levels
        the operator with the same `OperatorLevels` rules the game previews with.

        - Levels stop at the cap for the operator's rarity and elite phase. At the cap
          the EXP bar is empty and any overflow is lost - but a whole record that would
          land entirely past the cap is refused (`422`).
        - The LMD cost is a share of the EXP actually applied, rounded up: 3 in 10 at
          elite 0. EXP lost past the cap costs nothing.
        - Records and LMD are taken together or not at all.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: characterId
          in: path
          required: true
          schema:
            type: string
          examples: [PULSE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelUpRequest'
      responses:
        '200':
          description: Levelled. The whole save comes back with the operator, records and LMD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelUpResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `CHARACTER_NOT_OWNED`, `LEVEL_CAPPED` (already at the cap for its elite
            phase), or `INSUFFICIENT_FUNDS` (not enough LMD or records). Nothing is spent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/characters/{characterId}/promote:
    post:
      tags: [characters]
      operationId: promoteCharacter
      summary: Promote an operator to its next elite phase, raising its level cap.
      description: |
        Only at the current level cap, and only to the next phase the rarity reaches
        (3-star: Elite 1; 4-star and up: Elite 2). The level stays where it is - only
        the cap rises - so the operator plays exactly as before until it is levelled
        again, now on the new phase's EXP curve.

        Costs LMD, Orirock and Sugar Substitute by rarity and phase
        (`OperatorLevels.PromotionCost`), all taken together or none.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: characterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteRequest'
      responses:
        '200':
          description: Promoted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `CHARACTER_NOT_OWNED`, `ELITE_CAPPED` (already at the last phase its rarity
            reaches), `BELOW_LEVEL_CAP` (level it to the cap first), or
            `INSUFFICIENT_FUNDS`. Nothing is spent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/shop/offers:
    get:
      tags: [shop]
      operationId: getShopOffers
      summary: What the shop is selling, and what it costs.
      description: |
        The catalogue and its prices come from the server. The client used to read
        both out of `ShopItemDataList.asset` and do the arithmetic itself, which meant
        the amount a player paid was a number their own device chose.

        Ordered and stable, so the shop does not reshuffle itself between visits. A
        price change is an UPDATE rather than a store release.
      responses:
        '200':
          description: The offers currently on sale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/shop/purchases:
    post:
      tags: [shop]
      operationId: purchase
      summary: Buy an offer.
      description: |
        The request names an offer and a quantity. It cannot name a price and it
        cannot name a resulting balance - both were the client's arithmetic before
        this existed.

        全有或全无 / The debit, the credit, the ledger row and the state version move
        together or not at all. A crash between the debit and the credit would
        otherwise take a player's currency and give them nothing.

        Returns the whole player, the way the Phase 2 writes do, so the client never
        has to work out what its inventory became.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '201':
          description: Bought.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such offer, or it is no longer on sale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            `INSUFFICIENT_FUNDS`, or `IDEMPOTENCY_KEY_CONFLICT`. 409 rather than 422
            for the balance: the request was well formed and the rule it broke is
            about state. Retrying it unchanged after earning more can succeed, which
            is what a conflict means.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs:
    post:
      tags: [runs]
      operationId: startRun
      summary: Open an attempt at a song.
      description: |
        Charges the stage's stamina and issues the run's seed.

        不是"扣理智" / Deliberately a lifecycle rather than a debit. The far end of
        this is a submitted result, and a result can only be trusted if the server
        already knows a run was opened, on which chart, what it cost, and with which
        random sequence. An endpoint that only spent stamina would have to be
        redesigned into this the moment scores arrive.

        The cost lives on the server. It had no home before: `DungeonMeta` declares a
        `reason` field but no DungeonMeta asset exists in the project, so
        SelectDungeonUI was spending a number that came from nowhere.

        选了谁要先说 / The operator is named here, before the song, and must be on the
        player's roster. Its modifiers are part of what the result is checked against;
        a result that could name its operator afterwards would name the strongest one.

        活动关卡 / With `eventId` the song is played as a stage of that event: refused while
        the event is not running or the stage before it has not been cleared, checked before
        anything is charged. Only such a run clears the stage and pays the event currency.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '201':
          description: The run is open. Play.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown chart, or not in rotation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            `INSUFFICIENT_STAMINA`, `CHARACTER_NOT_OWNED`, `STATE_CONFLICT` when two
            starts raced for the last of the bar; for an event stage `EVENT_CLOSED` or
            `STAGE_LOCKED`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{runId}/complete:
    post:
      tags: [runs]
      operationId: completeRun
      summary: Close a run and have its result reviewed.
      description: |
        Reviews the result, counts it towards the missions if it is a clear, and ranks it
        if it was accepted - committed together, so a run is never ranked without being
        closed nor counted without its result on record.

        三种结论 / The review answers one of three ways:

        - `Accepted` - consistent with the chart and the rules. A clear, and ranked.
        - `Flagged` - nothing impossible, but something statistical looks unlike a
          person (timing locked to the frame, input far beyond the notes). Still a clear;
          held off the leaderboards. The client is told only `UNDER_REVIEW`.
        - `Rejected` - impossible as submitted. Not ranked and NOT a clear: the missions
          do not move, since a forged clear is exactly what mission farming would send.
          The reasons are named, because they describe the client's own output.

        Malformed is not the same as dishonest: a missing result on a win or a negative
        count is a `422` and nothing is stored, while a well-formed result that cannot be
        true is stored and answered with a verdict.

        通关才算 / Only a clear advances the "clear any song" missions. The stamina is
        spent either way; it was spent when the run opened.

        The idempotency key the client uses is the run id itself: "this run ended" cannot
        honestly happen twice, so a retry replays the first answer.

        A run that belongs to someone else is answered exactly like one that does not
        exist. Telling them apart would let a stranger probe which run ids are real.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRunRequest'
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCompletion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `RUN_NOT_OPEN` - unknown, someone else's, or already closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The body is over 4 MiB. A real trace compresses to tens of kilobytes.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/leaderboards/{stageId}:
    get:
      tags: [leaderboards]
      operationId: getLeaderboard
      summary: A stage's board, top first, with the caller's own line.
      description: |
        Ties go to whoever set the score first: matching a score is not the same as having
        held it. `me` is the caller's entry and rank wherever it falls, page or not.
      parameters:
        - name: stageId
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
        - name: period
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LeaderboardPeriod'
